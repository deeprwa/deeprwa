<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>DeepRWA</title>

    <link rel="icon" href="av.png" type="image/png">


    <style>

        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================================
           THEME VARIABLES
           ========================================================= */

        :root {

            /* Main page background */
            --outer-theme: #1e1e1f;


            /* -----------------------------------------------------
               DESKTOP
               ----------------------------------------------------- */

            --desktop-chat-width: 672px;

            /*
             * CSS viewport top spacing.
             *
             * This corresponds to the laptop appearance that
             * was previously correct.
             */
            --desktop-chat-top: 40px;


            /*
             * Space below the central Taskade panel.
             *
             * IMPORTANT:
             * This is NOT a footer blocker.
             * It simply describes where the central panel ends.
             */
            --desktop-panel-bottom: 40px;


            /*
             * Only the Powered by Taskade row is covered.
             *
             * The disclaimer above it remains visible.
             */
            --desktop-powered-cover-height: 34px;


            /* -----------------------------------------------------
               MOBILE
               ----------------------------------------------------- */

            --mobile-side-space: 24px;

            --mobile-top-space: 24px;

            /*
             * Mobile Taskade footer row.
             *
             * This is deliberately larger than the previous
             * value so the remaining ~10px of "Powered by Taskade"
             * cannot appear.
             */
            --mobile-powered-cover-height: 44px;

        }


        /* =========================================================
           HTML
           ========================================================= */

        html {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme);

            overflow: hidden;
        }


        /* =========================================================
           BODY
           ========================================================= */

        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            position: relative;

            overflow: hidden;

            background: var(--outer-theme) !important;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #ececf1;

            /*
             * Respect devices with a bottom safe area.
             */
            padding-bottom: env(safe-area-inset-bottom);
        }


        /* =========================================================
           PAGE BACKGROUND
           ========================================================= */

        .page-background {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: var(--outer-theme);

            z-index: 0;

            pointer-events: none;
        }


        /* =========================================================
           TASKADE CONTAINER
           ========================================================= */

        .agent-container {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme) !important;

            border: 0;
            outline: 0;

            z-index: 1;

            overflow: hidden;
        }


        /* =========================================================
           TASKADE IFRAME
           ========================================================= */

        .agent-container iframe {

            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: transparent !important;

            z-index: 1;
        }


        /* =========================================================
           DESKTOP OUTER MASK — TOP
           ========================================================= */

        .outer-top {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: var(--desktop-chat-top);

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER MASK — LEFT
           ========================================================= */

        .outer-left {

            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--desktop-panel-bottom);

            left: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER MASK — RIGHT
           ========================================================= */

        .outer-right {

            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--desktop-panel-bottom);

            right: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           POWERED BY TASKADE COVER
           
           IMPORTANT:
           
           This is NOT a full-page footer.
           
           It covers ONLY the bottom Taskade branding row.
           
           The disclaimer:
           
           "DeepRWA can make a mistake."
           
           remains visible above it.
           ========================================================= */

        .powered-by-cover {

            position: fixed;

            /*
             * Central panel horizontal position.
             */
            left: 50%;

            width: var(--desktop-chat-width);

            transform: translateX(-50%);


            /*
             * The central panel ends 40px above the bottom of the
             * browser viewport on the desktop layout.
             */
            bottom: var(--desktop-panel-bottom);


            /*
             * Only cover the Powered by Taskade row.
             */
            height: var(--desktop-powered-cover-height);


            background: var(--outer-theme) !important;

            /*
             * IMPORTANT:
             *
             * This layer MUST receive the click/touch.
             *
             * Because the layer sits above the iframe, clicking,
             * touching, or tapping this area cannot reach the
             * Taskade "Powered by Taskade" link.
             */
            pointer-events: auto;

            cursor: default;

            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;

            border: 0;
            outline: 0;

            box-shadow: none;

            z-index: 25;
        }


        /* =========================================================
           LOADING OVERLAY
           ========================================================= */

        .loading-overlay {

            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 16px;

            background: var(--outer-theme) !important;

            z-index: 50;

            opacity: 1;

            transition:
                opacity 0.5s ease;
        }


        .loading-overlay.hidden {

            opacity: 0;

            pointer-events: none;
        }


        /* =========================================================
           LOADING SPINNER
           ========================================================= */

        .loading-spinner {

            width: 44px;
            height: 44px;

            border: 3px solid #2d2d30;

            border-top-color: #ececf1;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        .loading-text {

            color: #6e6e72;

            font-size: 14px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (min-width: 769px) and (max-width: 1100px) {

            :root {

                /*
                 * Slightly smaller top spacing.
                 */
                --desktop-chat-top: 32px;

                /*
                 * Central panel scales down.
                 */
                --desktop-chat-width:
                    min(
                        672px,
                        calc(100vw - 32px)
                    );

                /*
                 * Preserve breathing room below panel.
                 */
                --desktop-panel-bottom: 32px;

                /*
                 * Slightly larger cover for tablet variations.
                 */
                --desktop-powered-cover-height: 36px;
            }

        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 768px) {

            html,
            body {

                width: 100%;
                height: 100%;

                overflow: hidden;

                background:
                    var(--outer-theme) !important;
            }


            /* -----------------------------------------------------
               Disable desktop side masks.
               ----------------------------------------------------- */

            .outer-top,
            .outer-left,
            .outer-right {

                display: none;
            }


            /* -----------------------------------------------------
               Taskade container
               ----------------------------------------------------- */

            .agent-container {

                position: fixed;

                top: 0;
                left: 0;
                right: 0;
                bottom: 0;

                width: 100%;
                height: 100%;

                overflow: hidden;

                background:
                    var(--outer-theme) !important;
            }


            /* -----------------------------------------------------
               Mobile iframe
               ----------------------------------------------------- */

            .agent-container iframe {

                position: absolute;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                border: 0;

                background:
                    transparent !important;
            }


            /* -----------------------------------------------------
               MOBILE POWERED-BY COVER
               
               On mobile the Taskade panel reaches the bottom of
               the visible page.
               
               Therefore the cover sits at bottom:0 rather than
               using the desktop 40px spacing.
               ----------------------------------------------------- */

            .powered-by-cover {

                left: 0;
                right: 0;

                width: 100%;

                transform: none;

                bottom: 0;

                /*
                 * 44px gives enough coverage to completely hide
                 * the Powered by Taskade row while preserving the
                 * disclaimer above it.
                 */
                height:
                    var(--mobile-powered-cover-height);

                z-index: 25;

                /*
                 * Crucial:
                 *
                 * Touch/click events stop here.
                 *
                 * They never reach the iframe underneath.
                 */
                pointer-events: auto;
            }

        }


        /* =========================================================
           VERY SMALL PHONES
           ========================================================= */

        @media (max-width: 480px) {

            /*
             * Keep the Taskade interface completely responsive.
             */

            .agent-container,
            .agent-container iframe {

                width: 100%;
                height: 100%;
            }


            /*
             * Slightly stronger footer coverage for very narrow
             * devices where Taskade's footer can wrap or shift.
             */
            .powered-by-cover {

                height: 46px;

                bottom: 0;

                left: 0;
                right: 0;

                width: 100%;

                transform: none;

                pointer-events: auto;

                z-index: 25;
            }

        }


        /* =========================================================
           LANDSCAPE PHONES
           ========================================================= */

        @media (max-width: 900px) and (orientation: landscape) {

            /*
             * Landscape phones have very limited vertical space.
             *
             * Do not use the desktop geometry.
             */

            .outer-top,
            .outer-left,
            .outer-right {

                display: none;
            }


            .agent-container,
            .agent-container iframe {

                width: 100%;
                height: 100%;
            }


            /*
             * Keep the Taskade branding hidden without creating
             * a giant bottom obstruction.
             */
            .powered-by-cover {

                left: 0;
                right: 0;

                width: 100%;

                transform: none;

                bottom: 0;

                height: 40px;

                pointer-events: auto;

                z-index: 25;
            }

        }


        /* =========================================================
           TOUCH DEVICES
           ========================================================= */

        @media (hover: none) and (pointer: coarse) {

            /*
             * Do NOT disable the powered-by cover.
             *
             * It is specifically required to intercept touch
             * events so the hidden Taskade link cannot be opened.
             */

            .powered-by-cover {

                pointer-events: auto;

                cursor: default;
            }

        }


        /* =========================================================
           HIDE SCROLLBARS
           ========================================================= */

        ::-webkit-scrollbar {

            display: none;
        }

    </style>

</head>


<body>


    <!-- =========================================================
         PAGE BACKGROUND
         ========================================================= -->

    <div
        class="page-background"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         TASKADE AGENT
         ========================================================= -->

    <div
        class="agent-container"
        id="agentContainer"
    >


        <!-- =====================================================
             LOADING OVERLAY
             ===================================================== -->

        <div
            class="loading-overlay"
            id="loadingOverlay"
        >

            <div class="loading-spinner"></div>

            <div class="loading-text">
                Loading DeepRWA...
            </div>

        </div>


        <!-- =====================================================
             TASKADE IFRAME
             ===================================================== -->

        <iframe
            id="agentFrame"
            src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431"
            allow="clipboard-read; clipboard-write"
            title="DeepRWA AI Assistant">
        </iframe>

    </div>


    <!-- =========================================================
         DESKTOP OUTER THEME
         ========================================================= -->

    <div
        class="outer-top"
        aria-hidden="true">
    </div>


    <div
        class="outer-left"
        aria-hidden="true">
    </div>


    <div
        class="outer-right"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         POWERED BY TASKADE HIDING LAYER

         This covers ONLY the Taskade branding row.

         It intentionally sits ABOVE the iframe.

         pointer-events:auto prevents the hidden Taskade link
         from receiving mouse/touch events.
         ========================================================= -->

    <div
        class="powered-by-cover"
        aria-hidden="true">
    </div>


    <script>


        /* =========================================================
           TASKADE URL
           ========================================================= */

        const AGENT_URL =
            "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";


        /* =========================================================
           LOADING HANDLER
           ========================================================= */

        function handleLoading() {

            const overlay =
                document.getElementById("loadingOverlay");

            const iframe =
                document.getElementById("agentFrame");


            if (!overlay || !iframe) {
                return;
            }


            /*
             * Show loading screen initially.
             */

            overlay.classList.remove("hidden");


            /*
             * Remove loading screen after iframe loads.
             */

            iframe.addEventListener(
                "load",
                function () {

                    setTimeout(
                        function () {

                            overlay.classList.add("hidden");

                        },
                        500
                    );

                },
                {
                    once: true
                }
            );


            /*
             * Safety fallback.
             */

            setTimeout(
                function () {

                    overlay.classList.add("hidden");

                },
                3500
            );
        }


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                handleLoading();

            }
        );


    </script>


</body>

</html>
