<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRWA</title>
    <link rel="icon" href="av.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #343541;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: #ececf1;
        }

        .agent-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #343541;
            position: relative;
        }

        .agent-container iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #343541;
            pointer-events: none;
            z-index: 1;
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #343541;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 16px;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #2d2d30;
            border-top-color: #ececf1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #6e6e72;
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== CUSTOM INPUT OVERLAY ===== */
        .input-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 15;
            padding: 12px 20px 20px 20px;
            background: transparent;
            pointer-events: none;
        }

        .input-inner {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(30, 136, 229, 0.1);
            border-radius: 16px;
            padding: 10px 16px;
            border: 1px solid rgba(30, 136, 229, 0.35);
            box-shadow: 0 2px 8px rgba(30, 136, 229, 0.1);
            pointer-events: auto;
            max-width: 768px;
            margin: 0 auto;
            transition: all 0.2s ease;
        }

        .input-inner:focus-within {
            border-color: #1E88E5;
            background: rgba(30, 136, 229, 0.15);
            box-shadow: 0 0 0 4px rgba(30, 136, 229, 0.2);
        }

        .input-inner input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ececf1;
            font-size: 15px;
            padding: 6px 4px;
            outline: none;
            font-family: inherit;
            min-height: 32px;
        }

        .input-inner input::placeholder {
            color: #8e8e93;
        }

        .input-inner .send-btn {
            background: #1E88E5;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            flex-shrink: 0;
            line-height: 1.4;
            transition: background 0.2s;
            min-width: 56px;
            text-align: center;
        }

        .input-inner .send-btn:hover {
            background: #1565C0;
        }

        @media (max-width: 768px) {
            .input-wrapper {
                padding: 8px 12px 12px 12px;
            }
            .input-inner {
                padding: 8px 12px;
                border-radius: 12px;
            }
            .input-inner input {
                font-size: 14px;
                padding: 4px 2px;
                min-height: 28px;
            }
            .input-inner .send-btn {
                padding: 5px 14px;
                font-size: 13px;
                min-width: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="agent-container" id="agentContainer">
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading DeepRWA...</div>
        </div>

        <!-- Custom Input Overlay -->
        <div class="input-wrapper">
            <div class="input-inner">
                <input type="text" id="customInput" placeholder="Ask me anything about Rwanda..." autofocus>
                <button class="send-btn" id="sendBtn">Send</button>
            </div>
        </div>

        <!-- Taskade Agent -->
        <iframe id="agentFrame" src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431" allow="clipboard-read; clipboard-write"></iframe>
    </div>

    <script>
        const AGENT_URL = "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";

        // ===== LOADING OVERLAY =====
        function handleLoading() {
            const overlay = document.getElementById('loadingOverlay');
            const iframe = document.getElementById('agentFrame');

            overlay.classList.remove('hidden');

            iframe.addEventListener('load', function() {
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 500);
            });

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 3000);
        }

        // ===== CUSTOM INPUT =====
        function setupCustomInput() {
            const input = document.getElementById('customInput');
            const sendBtn = document.getElementById('sendBtn');
            const iframe = document.getElementById('agentFrame');

            function sendMessage() {
                const message = input.value.trim();
                if (!message) return;

                // Try to send to iframe via postMessage
                try {
                    iframe.contentWindow.postMessage({
                        type: 'user_message',
                        message: message
                    }, '*');
                } catch (e) {}

                // Try to fill Taskade's input
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow?.document;
                    if (doc) {
                        const inputs = doc.querySelectorAll('input[type="text"], textarea');
                        for (const inp of inputs) {
                            if (inp.placeholder && inp.placeholder.toLowerCase().includes('ask')) {
                                inp.value = message;
                                inp.dispatchEvent(new Event('input', { bubbles: true }));
                                const btns = doc.querySelectorAll('button');
                                for (const btn of btns) {
                                    if (btn.textContent.toLowerCase().includes('send')) {
                                        btn.click();
                                        break;
                                    }
                                }
                                break;
                            }
                        }
                    }
                } catch (e) {}

                input.value = '';
                input.focus();
            }

            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            setTimeout(() => input.focus(), 1500);

            document.getElementById('agentContainer').addEventListener('click', function(e) {
                if (!e.target.closest('.input-inner')) {
                    input.focus();
                }
            });
        }

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            handleLoading();
            setupCustomInput();
        });

        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 1000);
        });
    </script>
</body>
</html>
