<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRWA</title>
    <link rel="icon" href="av.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #343541;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: #ececf1;
        }

        .agent-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #343541;
            position: relative;
        }

        .agent-container iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #343541;
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #343541;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 16px;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #2d2d30;
            border-top-color: #ececf1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #6e6e72;
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COVER "POWERED BY TASKADE" ===== */
        /* Extended height to fully cover the Powered by Taskade text */
        .footer-cover {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #343541;
            z-index: 15;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="agent-container" id="agentContainer">
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading DeepRWA...</div>
        </div>

        <!-- Footer Cover: Hides "Powered by Taskade" -->
        <div class="footer-cover"></div>

        <!-- Taskade Agent -->
        <iframe id="agentFrame" src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431" allow="clipboard-read; clipboard-write"></iframe>
    </div>

    <script>
        const AGENT_URL = "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";

        // ===== LOADING OVERLAY =====
        function handleLoading() {
            const overlay = document.getElementById('loadingOverlay');
            const iframe = document.getElementById('agentFrame');

            overlay.classList.remove('hidden');

            iframe.addEventListener('load', function() {
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 500);
            });

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 3000);
        }

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            handleLoading();
        });

        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 1000);
        });
    </script>
</body>
</html>
