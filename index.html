<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>DeepRWA</title>

    <link rel="icon" href="av.png" type="image/png">


    <style>

        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================================
           THEME VARIABLES
           ========================================================= */

        :root {

            /* Outer page background */
            --outer-theme: #1e1e1f;

            /* Taskade desktop panel width */
            --desktop-chat-width: 672px;

            /* Desktop top spacing */
            --desktop-chat-top: 40px;

            /*
             * IMPORTANT:
             * This preserves the desktop geometry that was
             * previously working correctly.
             */
            --desktop-footer-height: 72px;

            /*
             * Tablet footer shield.
             */
            --tablet-footer-height: 48px;

            /*
             * Mobile footer shield.
             *
             * This is intentionally much smaller than the
             * desktop 72px value.
             *
             * It hides the Powered by Taskade row while leaving
             * the "DeepRWA can make a mistake" text visible.
             */
            --mobile-footer-height: 34px;

            /*
             * Landscape phone footer shield.
             */
            --landscape-footer-height: 30px;
        }


        /* =========================================================
           HTML
           ========================================================= */

        html {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme);

            overflow: hidden;

            /*
             * Prevent browser overscroll from creating strange
             * white/gray areas around the application.
             */
            overscroll-behavior: none;
        }


        /* =========================================================
           BODY
           ========================================================= */

        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            position: relative;

            overflow: hidden;

            background: var(--outer-theme) !important;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #ececf1;

            /*
             * Mobile safe-area support.
             */
            padding-bottom: env(safe-area-inset-bottom);

            overscroll-behavior: none;
        }


        /* =========================================================
           FULL PAGE BACKGROUND
           ========================================================= */

        .page-background {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: var(--outer-theme);

            z-index: 0;

            /*
             * Never interfere with Taskade interaction.
             */
            pointer-events: none;
        }


        /* =========================================================
           TASKADE CONTAINER
           ========================================================= */

        .agent-container {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme) !important;

            border: 0;
            outline: 0;

            z-index: 1;

            overflow: hidden;
        }


        /* =========================================================
           TASKADE IFRAME
           ========================================================= */

        .agent-container iframe {

            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: transparent !important;

            z-index: 1;
        }


        /* =========================================================
           DESKTOP OUTER MASK — TOP
           ========================================================= */

        .outer-top {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: var(--desktop-chat-top);

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER MASK — LEFT
           ========================================================= */

        .outer-left {

            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--desktop-footer-height);

            left: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER MASK — RIGHT
           ========================================================= */

        .outer-right {

            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--desktop-footer-height);

            right: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           POWERED-BY SHIELD
           =========================================================

           This is the important part.

           Taskade is loaded inside a cross-origin iframe, so the
           parent page cannot directly select/hide the Taskade
           "Powered by Taskade" element.

           Therefore this shield sits ABOVE the iframe.

           pointer-events: auto means:

               - click = blocked
               - tap = blocked
               - touch = blocked

           The user cannot accidentally activate the hidden
           Taskade footer link.

           On desktop we deliberately preserve the previous
           72px geometry because that was the version you said
           looked correct on the laptop.

           On mobile this is replaced by a much smaller shield.
           ========================================================= */

        .powered-by-shield {

            position: fixed;

            left: 0;
            right: 0;

            bottom: 0;

            height: var(--desktop-footer-height);

            background: var(--outer-theme);

            z-index: 30;

            /*
             * VERY IMPORTANT:
             *
             * Unlike the old version, this is intentionally
             * clickable/touchable as an overlay so it blocks
             * interaction with the hidden Taskade link.
             */
            pointer-events: auto;

            cursor: default;

            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;

            -webkit-touch-callout: none;

            border: 0;
            outline: 0;

            box-shadow: none;

            /*
             * Prevent the overlay itself from producing any
             * visual or accessibility content.
             */
            font-size: 0;
            line-height: 0;
        }


        /* =========================================================
           LOADING OVERLAY
           ========================================================= */

        .loading-overlay {

            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 16px;

            background: var(--outer-theme) !important;

            z-index: 50;

            opacity: 1;

            transition:
                opacity 0.5s ease;

            pointer-events: auto;
        }


        .loading-overlay.hidden {

            opacity: 0;

            pointer-events: none;
        }


        /* =========================================================
           LOADING SPINNER
           ========================================================= */

        .loading-spinner {

            width: 44px;
            height: 44px;

            border: 3px solid #2d2d30;

            border-top-color: #ececf1;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        .loading-text {

            color: #6e6e72;

            font-size: 14px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (min-width: 769px) and (max-width: 1100px) {

            :root {

                /*
                 * Slightly smaller top spacing.
                 */
                --desktop-chat-top: 32px;

                /*
                 * Responsive tablet footer.
                 */
                --desktop-footer-height: 48px;

                /*
                 * Never allow the panel to exceed the viewport.
                 */
                --desktop-chat-width:
                    min(
                        672px,
                        calc(100vw - 32px)
                    );
            }


            /*
             * Tablet outer masks use the responsive variables.
             */
            .outer-left,
            .outer-right {

                bottom: var(--desktop-footer-height);
            }


            /*
             * Tablet shield.
             *
             * Small enough not to interfere with the main
             * Taskade interface.
             */
            .powered-by-shield {

                height: var(--tablet-footer-height);
            }
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 768px) {

            html,
            body {

                width: 100%;
                height: 100%;

                overflow: hidden;

                background:
                    var(--outer-theme) !important;

                /*
                 * Prevent pull-to-refresh/overscroll behavior
                 * from disturbing the embedded application.
                 */
                overscroll-behavior: none;
            }


            /* -----------------------------------------------------
               REMOVE ALL DESKTOP GEOMETRY
               ----------------------------------------------------- */

            .outer-top,
            .outer-left,
            .outer-right {

                display: none !important;
            }


            /* -----------------------------------------------------
               MOBILE TASKADE CONTAINER
               ----------------------------------------------------- */

            .agent-container {

                position: fixed;

                top: 0;
                left: 0;
                right: 0;
                bottom: 0;

                width: 100%;
                height: 100%;

                overflow: hidden;

                background:
                    var(--outer-theme) !important;
            }


            /* -----------------------------------------------------
               MOBILE TASKADE IFRAME
               ----------------------------------------------------- */

            .agent-container iframe {

                position: absolute;

                top: 0;
                left: 0;
                right: 0;
                bottom: 0;

                width: 100%;
                height: 100%;

                margin: 0;
                padding: 0;

                border: 0;

                background:
                    transparent !important;
            }


            /* -----------------------------------------------------
               MOBILE POWERED-BY SHIELD
               -----------------------------------------------------

               ONLY 34px.

               This is deliberately NOT 48px, 60px, or 72px.

               The purpose is to hide the Powered by Taskade
               footer row while leaving:

                   "DeepRWA can make a mistake"

               visible above it.

               The shield also intercepts taps/clicks.
               ----------------------------------------------------- */

            .powered-by-shield {

                display: block !important;

                position: fixed;

                left: 0;
                right: 0;

                bottom: 0;

                height: var(--mobile-footer-height);

                background:
                    var(--outer-theme) !important;

                z-index: 30;

                pointer-events: auto;

                cursor: default;

                touch-action: none;

                user-select: none;
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;

                -webkit-touch-callout: none;

                border: 0;
                outline: 0;

                box-shadow: none;

                font-size: 0;
                line-height: 0;
            }
        }


        /* =========================================================
           VERY SMALL PHONES
           ========================================================= */

        @media (max-width: 480px) {

            .powered-by-shield {

                height: 34px;

                /*
                 * Respect devices that report a bottom safe area.
                 * The shield remains at the very bottom of the
                 * usable screen.
                 */
                bottom: 0;
            }


            .agent-container,
            .agent-container iframe {

                width: 100%;
                height: 100%;
            }
        }


        /* =========================================================
           LANDSCAPE PHONES
           ========================================================= */

        @media (max-width: 900px) and (orientation: landscape) {

            /*
             * Remove desktop geometry.
             */
            .outer-top,
            .outer-left,
            .outer-right {

                display: none !important;
            }


            /*
             * Full landscape viewport.
             */
            .agent-container {

                position: fixed;

                top: 0;
                left: 0;
                right: 0;
                bottom: 0;

                width: 100%;
                height: 100%;
            }


            .agent-container iframe {

                width: 100%;
                height: 100%;
            }


            /*
             * Landscape screens are vertically short, so reduce
             * the shield further.
             */
            .powered-by-shield {

                display: block !important;

                height:
                    var(--landscape-footer-height);

                bottom: 0;

                pointer-events: auto;

                touch-action: none;
            }
        }


        /* =========================================================
           TOUCH DEVICES
           =========================================================

           This makes sure a phone/tablet never accidentally gets
           the desktop 72px shield simply because of its browser
           width.
           ========================================================= */

        @media (hover: none) and (pointer: coarse) {

            .outer-top,
            .outer-left,
            .outer-right {

                display: none !important;
            }


            .powered-by-shield {

                display: block;

                height:
                    var(--mobile-footer-height);

                bottom: 0;

                pointer-events: auto;

                touch-action: none;
            }
        }


        /* =========================================================
           EXTRA-WIDE DESKTOP
           =========================================================

           Keep the central Taskade panel centered.
           ========================================================= */

        @media (min-width: 1101px) {

            .powered-by-shield {

                height:
                    var(--desktop-footer-height);

                bottom: 0;
            }
        }


        /* =========================================================
           HIDE SCROLLBAR
           ========================================================= */

        ::-webkit-scrollbar {

            display: none;
        }


        /*
         * Firefox.
         */
        html {

            scrollbar-width: none;
        }

    </style>

</head>


<body>


    <!-- =========================================================
         FULL PAGE BACKGROUND
         ========================================================= -->

    <div
        class="page-background"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         TASKADE AGENT
         ========================================================= -->

    <div
        class="agent-container"
        id="agentContainer"
    >


        <!-- =====================================================
             LOADING OVERLAY
             ===================================================== -->

        <div
            class="loading-overlay"
            id="loadingOverlay"
        >

            <div
                class="loading-spinner"
                aria-hidden="true">
            </div>

            <div class="loading-text">
                Loading DeepRWA...
            </div>

        </div>


        <!-- =====================================================
             TASKADE IFRAME
             ===================================================== -->

        <iframe
            id="agentFrame"
            src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431"
            allow="clipboard-read; clipboard-write"
            title="DeepRWA AI Assistant">
        </iframe>

    </div>


    <!-- =========================================================
         DESKTOP / MOBILE POWERED-BY SHIELD
         =========================================================

         IMPORTANT:

         This element intentionally sits ABOVE the iframe.

         It hides the Taskade footer and captures clicks/touches.

         It contains NO link and NO JavaScript navigation.

         Therefore clicking/tapping it does nothing.
         ========================================================= -->

    <div
        class="powered-by-shield"
        id="poweredByShield"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>

        /* =========================================================
           TASKADE URL
           ========================================================= */

        const AGENT_URL =
            "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";


        /* =========================================================
           LOADING HANDLER
           ========================================================= */

        function handleLoading() {

            const overlay =
                document.getElementById("loadingOverlay");

            const iframe =
                document.getElementById("agentFrame");


            if (!overlay || !iframe) {
                return;
            }


            /*
             * Show loading screen initially.
             */
            overlay.classList.remove("hidden");


            /*
             * Hide loading screen when Taskade has loaded.
             */
            iframe.addEventListener(
                "load",
                function () {

                    setTimeout(
                        function () {

                            overlay.classList.add("hidden");

                        },
                        500
                    );

                },
                {
                    once: true
                }
            );


            /*
             * Safety fallback.
             */
            setTimeout(
                function () {

                    overlay.classList.add("hidden");

                },
                3500
            );
        }


        /* =========================================================
           POWERED-BY SHIELD SAFETY
           =========================================================

           The shield itself has no navigation.

           These handlers deliberately prevent interaction from
           propagating through the shield to anything underneath it.

           This is an additional safety layer for mouse and touch.
           ========================================================= */

        function protectPoweredByArea() {

            const shield =
                document.getElementById("poweredByShield");


            if (!shield) {
                return;
            }


            /*
             * Mouse interaction.
             */
            shield.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                },
                true
            );


            /*
             * Touch interaction.
             */
            shield.addEventListener(
                "touchstart",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                },
                {
                    capture: true,
                    passive: false
                }
            );


            shield.addEventListener(
                "touchend",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                },
                {
                    capture: true,
                    passive: false
                }
            );


            /*
             * Pointer interaction for modern browsers.
             */
            shield.addEventListener(
                "pointerdown",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                },
                true
            );


            shield.addEventListener(
                "pointerup",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                },
                true
            );
        }


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                handleLoading();

                protectPoweredByArea();

            }
        );

    </script>

</body>

</html>
