<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRWA</title>
    <link rel="icon" href="av.png" type="image/png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --outer-theme: #1e1e1f;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--outer-theme) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, sans-serif;
            color: #ececf1;
        }

        body {
            position: relative;
        }

        /* =========================================================
           PARENT PAGE BACKGROUND
           ========================================================= */

        .page-background {
            position: fixed;
            inset: 0;
            background: var(--outer-theme);
            z-index: 0;
            pointer-events: none;
        }

        /* =========================================================
           TASKADE IFRAME
           ========================================================= */

        .agent-container {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme) !important;

            border: 0;
            outline: 0;

            z-index: 1;
        }

        .agent-container iframe {
            position: absolute;
            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: transparent !important;

            z-index: 1;
        }

        /* =========================================================
           OUTER THEME MASK

           The iframe is cross-origin, so we cannot modify the
           Taskade page's own #17191C background.

           This layer sits above the iframe and paints the area
           surrounding the central chat with #1E1E1F.

           pointer-events:none means the Taskade interface remains
           clickable.
           ========================================================= */

        .outer-theme-mask {
            position: fixed;
            inset: 0;

            z-index: 10;

            pointer-events: none;

            /*
             * Central chat dimensions from the supplied screenshot:
             *
             * Width  ≈ 672px
             * Top    ≈ 127px
             * Bottom ≈ 656px
             *
             * The transparent center is created using a box-shadow.
             */

            left: 50%;
            top: 127px;

            width: 672px;
            height: 529px;

            transform: translateX(-50%);

            background: transparent;

            box-shadow:
                0 0 0 100vmax var(--outer-theme);
        }

        /* =========================================================
           TOP CORNER / ROUNDED CHAT BOUNDARY

           Keeps the mask from visually covering the rounded
           corners of the Taskade chat panel.
           ========================================================= */

        .outer-theme-mask::before {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: 15px;

            /*
             * The shadow is already doing the main masking.
             * This keeps the central area transparent.
             */
            background: transparent;
        }

        /* =========================================================
   FOOTER COVER
   ========================================================= */

.footer-cover {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    /* IMPORTANT:
       The original screenshot shows the bottom strip
       beginning 72px above the bottom of the viewport. */
    height: 72px;

    background: var(--outer-theme) !important;

    z-index: 20;

    pointer-events: none;

    user-select: none;

    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;

    border: 0;
    outline: 0;
    box-shadow: none;
}


/* =========================================================
   FOOTER CLICK BLOCKER
   ========================================================= */

.footer-blocker {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 72px;

    z-index: 21;

    background: transparent;

    pointer-events: auto;

    cursor: default;
}

        /* =========================================================
           LOADING OVERLAY
           ========================================================= */

        .loading-overlay {
            position: fixed;
            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 16px;

            background: var(--outer-theme) !important;

            z-index: 50;

            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;

            border: 3px solid #2d2d30;
            border-top-color: #ececf1;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #6e6e72;
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           HIDE SCROLLBAR
           ========================================================= */

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Parent page background -->
    <div class="page-background"></div>

    <!-- Taskade -->
    <div class="agent-container" id="agentContainer">

        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading DeepRWA...</div>
        </div>

        <iframe
            id="agentFrame"
            src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431"
            allow="clipboard-read; clipboard-write">
        </iframe>

    </div>

    <!-- Paints #1E1E1F around the chat -->
    <div class="outer-theme-mask"></div>

    <!-- Bottom theme -->
    <div class="footer-cover"></div>

    <!-- Prevent interaction with footer -->
    <div class="footer-blocker"></div>


    <script>
        const AGENT_URL =
            "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";


        /* =========================================================
           LOADING
           ========================================================= */

        function handleLoading() {

            const overlay =
                document.getElementById("loadingOverlay");

            const iframe =
                document.getElementById("agentFrame");

            overlay.classList.remove("hidden");

            iframe.addEventListener("load", function () {

                setTimeout(() => {
                    overlay.classList.add("hidden");
                }, 500);

            });

            setTimeout(() => {
                overlay.classList.add("hidden");
            }, 3000);
        }


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener("DOMContentLoaded", function () {

            handleLoading();

        });

    </script>

</body>
</html>
