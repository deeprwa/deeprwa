<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRWA</title>
    <link rel="icon" href="av.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #343541;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: #ececf1;
        }

        .agent-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #343541;
            position: relative;
        }

        .agent-container iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #343541;
            position: relative;
            z-index: 1;
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #343541;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 16px;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #2d2d30;
            border-top-color: #ececf1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #6e6e72;
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COVER "POWERED BY TASKADE" ===== */
        .footer-cover {
            position: absolute;
            bottom: 8px;
            right: 20px;
            z-index: 10;
            background: #343541;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #8e8e93;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            pointer-events: none;
        }

        /* ===== CUSTOM INPUT OVERLAY ===== */
        /* Hide Taskade's input and show ours */
        .custom-input-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 15;
            padding: 12px 20px 20px 20px;
            background: transparent;
            pointer-events: none;
            display: flex;
            justify-content: center;
        }

        .custom-input-inner {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #40414f;
            border-radius: 12px;
            padding: 8px 12px;
            border: 1px solid #5a5a5e;
            pointer-events: auto;
            max-width: 768px;
            width: 100%;
            transition: border-color 0.2s;
        }

        .custom-input-inner:focus-within {
            border-color: #1E88E5;
        }

        .custom-input-inner input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ececf1;
            font-size: 15px;
            padding: 8px 4px;
            outline: none;
            font-family: inherit;
            min-height: 32px;
            width: 100%;
        }

        .custom-input-inner input::placeholder {
            color: #8e8e93;
        }

        .custom-input-inner .send-btn {
            background: #1E88E5;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            flex-shrink: 0;
            line-height: 1.4;
            transition: background 0.2s;
            min-width: 56px;
            text-align: center;
        }

        .custom-input-inner .send-btn:hover {
            background: #1565C0;
        }

        /* Hide Taskade's original input (covered by overlay) */
        .agent-container iframe {
            pointer-events: none;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .custom-input-wrapper {
                padding: 8px 12px 12px 12px;
            }
            .custom-input-inner {
                padding: 6px 10px;
            }
            .custom-input-inner input {
                font-size: 14px;
                padding: 6px 4px;
            }
            .custom-input-inner .send-btn {
                padding: 5px 14px;
                font-size: 13px;
                min-width: 48px;
            }
            .footer-cover {
                font-size: 10px;
                bottom: 6px;
                right: 10px;
                padding: 2px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="agent-container" id="agentContainer">
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading DeepRWA...</div>
        </div>

        <!-- Footer Cover: "Powered by Taskade" replaced -->
        <div class="footer-cover" id="footerCover">DeepRWA can make a mistake.</div>

        <!-- Taskade Agent -->
        <iframe id="agentFrame" src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431" allow="clipboard-read; clipboard-write"></iframe>

        <!-- Custom Input Overlay -->
        <div class="custom-input-wrapper" id="customInputWrapper">
            <div class="custom-input-inner">
                <input type="text" id="customInput" placeholder="Ask me anything about Rwanda..." autofocus>
                <button class="send-btn" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const AGENT_URL = "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";

        // ===== LOADING OVERLAY =====
        function handleLoading() {
            const overlay = document.getElementById('loadingOverlay');
            const iframe = document.getElementById('agentFrame');

            overlay.classList.remove('hidden');

            iframe.addEventListener('load', function() {
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 500);
            });

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 3000);
        }

        // ===== CUSTOM INPUT =====
        function setupCustomInput() {
            const input = document.getElementById('customInput');
            const sendBtn = document.getElementById('sendBtn');
            const iframe = document.getElementById('agentFrame');

            function sendMessage() {
                const message = input.value.trim();
                if (!message) return;

                // Try to send to iframe via postMessage
                try {
                    iframe.contentWindow.postMessage({
                        type: 'user_message',
                        message: message
                    }, '*');
                } catch (e) {}

                // Try to fill Taskade's input
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow?.document;
                    if (doc) {
                        const inputs = doc.querySelectorAll('input[type="text"], textarea');
                        for (const inp of inputs) {
                            if (inp.placeholder && inp.placeholder.toLowerCase().includes('ask')) {
                                inp.value = message;
                                inp.dispatchEvent(new Event('input', { bubbles: true }));
                                const btns = doc.querySelectorAll('button');
                                for (const btn of btns) {
                                    if (btn.textContent.toLowerCase().includes('send')) {
                                        btn.click();
                                        break;
                                    }
                                }
                                break;
                            }
                        }
                    }
                } catch (e) {}

                input.value = '';
                input.focus();
            }

            sendBtn.addEventListener('click', sendMessage);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Focus input
            setTimeout(() => input.focus(), 1500);

            // Click on container focuses input
            document.getElementById('agentContainer').addEventListener('click', function(e) {
                if (!e.target.closest('.custom-input-inner')) {
                    input.focus();
                }
            });
        }

        // ===== HIDE "POWERED BY TASKADE" =====
        function hidePoweredBy() {
            const iframe = document.getElementById('agentFrame');
            if (!iframe) return;

            try {
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (!doc) return;

                // Find and hide any element containing "Powered by Taskade"
                const observer = new MutationObserver(() => {
                    try {
                        const elements = doc.body.querySelectorAll('*');
                        for (const el of elements) {
                            if (el.textContent && el.textContent.includes('Powered by Taskade')) {
                                el.style.display = 'none';
                                if (el.parentElement) {
                                    el.parentElement.style.display = 'none';
                                }
                            }
                        }
                    } catch (e) {}
                });

                observer.observe(doc.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });

                // Immediate check
                setTimeout(() => {
                    const elements = doc.body.querySelectorAll('*');
                    for (const el of elements) {
                        if (el.textContent && el.textContent.includes('Powered by Taskade')) {
                            el.style.display = 'none';
                            if (el.parentElement) {
                                el.parentElement.style.display = 'none';
                            }
                        }
                    }
                }, 1000);

            } catch (e) {
                // Cross-origin restriction - normal
            }
        }

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', function() {
            // Show loading overlay
            document.getElementById('loadingOverlay').classList.remove('hidden');

            // Start handlers
            handleLoading();
            setupCustomInput();

            // Try to hide "Powered by Taskade" periodically
            setInterval(hidePoweredBy, 5000);
        });

        window.addEventListener('load', function() {
            setTimeout(hidePoweredBy, 1000);
        });
    </script>
</body>
</html>
