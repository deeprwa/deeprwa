<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRWA</title>
    <link rel="icon" href="av.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #343541;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: #ececf1;
        }

        .sidebar {
            width: 260px;
            background: #202123;
            display: flex;
            flex-direction: column;
            padding: 12px;
            flex-shrink: 0;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #2d2d30;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .sidebar.closed {
            transform: translateX(-100%);
            width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #4a4a4d; border-radius: 4px; }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 14px 4px;
            border-bottom: 1px solid #2d2d30;
            margin-bottom: 10px;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-logo img { width: 28px; height: 28px; border-radius: 50%; }
        .sidebar-logo span { font-size: 16px; font-weight: 600; color: #ececf1; }

        .sidebar-icon {
            background: none;
            border: none;
            color: #6e6e72;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 6px;
            transition: color 0.2s;
            border-radius: 4px;
        }
        .sidebar-icon:hover { color: #ececf1; background: #2d2d30; }

        .new-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 14px;
            background: transparent;
            border: 1px solid #3d3d40;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 400;
            color: #ececf1;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 12px;
        }
        .new-chat-btn:hover { background: #2d2d30; border-color: #5a5a5e; }
        .new-chat-btn span { font-size: 18px; font-weight: 300; color: #a0a0a5; }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-list::-webkit-scrollbar { width: 4px; }
        .chat-list::-webkit-scrollbar-thumb { background: #4a4a4d; border-radius: 4px; }

        .chat-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #ececf1;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
            margin-bottom: 2px;
            position: relative;
        }
        .chat-item:hover { background: #2d2d30; }
        .chat-item.active { background: #2d2d30; }

        .chat-item .chat-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-item .time {
            font-size: 11px;
            color: #6e6e72;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .chat-item .more-btn {
            background: none;
            border: none;
            color: #6e6e72;
            cursor: pointer;
            font-size: 18px;
            padding: 0 6px;
            transition: color 0.2s;
            flex-shrink: 0;
            opacity: 1;
            z-index: 50;
        }
        .chat-item .more-btn:hover { color: #ececf1; }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: #2d2d30;
            border-radius: 8px;
            padding: 6px 0;
            min-width: 140px;
            z-index: 999;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            margin-top: 4px;
        }
        .dropdown-menu.active { display: block; }
        .dropdown-menu button {
            display: block;
            width: 100%;
            padding: 8px 18px;
            background: none;
            border: none;
            color: #ececf1;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        .dropdown-menu button:hover { background: #3d3d40; }
        .dropdown-menu button.delete:hover { color: #e74c3c; }

        .sidebar-footer {
            padding-top: 12px;
            border-top: 1px solid #2d2d30;
            font-size: 12px;
            color: #6e6e72;
            text-align: center;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #343541;
            position: relative;
        }

        .main-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid #2d2d30;
            flex-shrink: 0;
            background: #343541;
            height: 60px;
        }

        .main-header .menu-btn {
            background: none;
            border: none;
            color: #ececf1;
            cursor: pointer;
            font-size: 20px;
            padding: 4px 8px;
            transition: color 0.2s;
            z-index: 20;
            display: none;
        }
        .main-header .menu-btn:hover { color: #a0a0a5; }

        .main-header .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            display: none;
        }
        .main-header .header-logo img { width: 28px; height: 28px; border-radius: 50%; }
        .main-header .header-logo span { font-size: 18px; font-weight: 600; color: #ececf1; }

        .main-header.has-logo .menu-btn { display: flex; }
        .main-header.has-logo .header-logo { display: flex; }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 24px;
            overflow-y: auto;
            background: #343541;
        }

        .chat-message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        .chat-message.user {
            align-self: flex-end;
            background: #1E88E5;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-message.assistant {
            align-self: flex-start;
            background: #40414f;
            color: #ececf1;
            border-bottom-left-radius: 4px;
        }

        .chat-message .timestamp {
            font-size: 11px;
            color: #8e8e93;
            margin-top: 4px;
            display: block;
        }

        .chat-message.user .timestamp {
            color: rgba(255,255,255,0.7);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #6e6e72;
            text-align: center;
        }

        .empty-state h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ececf1;
        }

        .empty-state p {
            font-size: 15px;
            max-width: 400px;
            color: #8e8e93;
        }

        .chat-input-area {
            padding: 12px 20px 16px 20px;
            background: #343541;
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #40414f;
            border-radius: 12px;
            padding: 8px 12px;
            border: 1px solid #5a5a5e;
            transition: border-color 0.2s;
            max-width: 100%;
        }

        .chat-input-wrapper:focus-within {
            border-color: #1E88E5;
        }

        .chat-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ececf1;
            font-size: 15px;
            padding: 8px 4px;
            outline: none;
            font-family: inherit;
            min-height: 32px;
        }

        .chat-input-wrapper input::placeholder {
            color: #8e8e93;
        }

        .chat-input-wrapper .send-btn {
            background: #3d3d40;
            border: none;
            color: #a0a0a5;
            padding: 6px 18px;
            border-radius: 8px;
            cursor: default;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            flex-shrink: 0;
            line-height: 1.4;
            transition: all 0.2s;
            min-width: 56px;
            text-align: center;
        }

        .chat-input-wrapper .send-btn.active {
            background: #1E88E5;
            color: white;
            cursor: pointer;
        }

        .chat-input-wrapper .send-btn.active:hover {
            background: #1565C0;
        }

        .chat-input-wrapper .send-btn.sending {
            background: #e74c3c;
            color: white;
            cursor: pointer;
        }

        .chat-input-wrapper .send-btn.sending:hover {
            background: #c0392b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #343541;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 16px;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #2d2d30;
            border-top-color: #ececf1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-text { color: #6e6e72; font-size: 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: #2d2d30;
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .modal h3 { color: #ececf1; font-size: 16px; margin-bottom: 8px; }
        .modal p { color: #a0a0a5; font-size: 14px; margin-bottom: 20px; }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal-buttons .cancel-btn { background: #3d3d40; color: #ececf1; }
        .modal-buttons .cancel-btn:hover { background: #4a4a4d; }
        .modal-buttons .confirm-btn { background: #e74c3c; color: white; }
        .modal-buttons .confirm-btn:hover { background: #c0392b; }

        .share-link-container {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: #3d3d40;
            border-radius: 6px;
            padding: 4px;
        }
        .share-link-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ececf1;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
        }
        .share-link-container button {
            background: #1E88E5;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .share-link-container button:hover { background: #1565C0; }

        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        .mobile-overlay.active { display: block; }

        .mobile-sidebar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: #202123;
            z-index: 1000;
            padding: 12px;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        .mobile-sidebar.active { transform: translateX(0); display: block; }

        .mobile-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .mobile-sidebar-header .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #ececf1;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-header { padding: 10px 16px; }
            .main-header .header-logo span { font-size: 16px; }
            .main-header .header-logo img { width: 24px; height: 24px; }
            .main-header.has-logo .menu-btn { display: flex; }
            .main-header.has-logo .header-logo { display: flex; }
            .chat-area { padding: 12px 16px; }
            .chat-message { max-width: 90%; }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading DeepRWA...</div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h3>Delete this chat?</h3>
            <p>This action cannot be undone.</p>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeDeleteModal()">Cancel</button>
                <button class="confirm-btn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="modal-overlay" id="shareModal">
        <div class="modal">
            <h3>Share this chat</h3>
            <p>Copy the link below to share this conversation.</p>
            <div class="share-link-container">
                <input type="text" id="shareLinkInput" value="" readonly>
                <button onclick="copyShareLink()">Copy</button>
            </div>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeShareModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Mobile -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="closeMobileSidebar()"></div>

    <div class="mobile-sidebar" id="mobileSidebar">
        <div class="mobile-sidebar-header">
            <div class="sidebar-logo" style="border:none;margin:0;padding:0;">
                <img src="av.png" alt="DeepRWA">
                <span>DeepRWA</span>
            </div>
            <button class="close-btn" onclick="closeMobileSidebar()">✕</button>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()"><span>+</span> New Chat</button>
        <div class="chat-list" id="mobileChatList"></div>
        <div class="sidebar-footer">DeepRWA · Your AI Assistant</div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="desktopSidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="av.png" alt="DeepRWA">
                <span>DeepRWA</span>
            </div>
            <button class="sidebar-icon" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()"><span>+</span> New Chat</button>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer">DeepRWA · Your AI Assistant</div>
    </div>

    <!-- Main Chat -->
    <div class="main-chat">
        <div class="main-header" id="mainHeader">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="header-logo">
                <img src="av.png" alt="DeepRWA">
                <span>DeepRWA</span>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div class="chat-area" id="chatArea">
            <!-- Messages will be rendered here -->
        </div>

        <!-- Chat Input -->
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <input type="text" id="chatInput" placeholder="Ask me anything about Rwanda..." autofocus>
                <button class="send-btn" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        // ===== SYSTEM PROMPT =====
        const SYSTEM_PROMPT = `You are DeepRWA, a professional AI assistant specialized in Rwanda.

**About You:**
- Created by Emmanuel Mukiza under his company "The Star🌟"
- Emmanuel graduated from Karenge Adventist Secondary School (KASS) with an Advanced Level certificate in Computer System and Architecture (CSA)

**Your Core Rule:**
- You must ONLY answer questions related to Rwanda.
- For greetings, respond warmly but remind the user of your Rwanda focus.
- If a user asks about other countries, politely state you specialize in Rwanda.

**Your Main Topics:**
1. Location Finder: Provinces, districts, sectors, cells, villages
2. Product & Price Finder: Where to find products and price ranges
3. Famous People: Biographies of notable Rwandans
4. History & Culture: Rwanda's history and cultural traditions
5. Tourism & Travel: Tourist attractions, national parks, travel tips
6. Events & News: Current events and festivals in Rwanda

**Response Rules:**
- Be warm, friendly, and conversational
- Greet users cheerfully
- Always maintain a respectful tone
- Be concise and clear

**Social Media Policy:**
- Share Emmanuel's social media only when specifically asked:
  - YouTube: https://www.youtube.com/@Th_estarME
  - Instagram: https://www.instagram.com/mukiza_me/
  - Facebook: https://web.facebook.com/meMukiza
  - X: https://x.com/mukiza_me
  - TikTok: https://www.tiktok.com/@the_star_mukiza`;

        // ===== CHAT DATA =====
        let chats = JSON.parse(localStorage.getItem('deeprwa_chats')) || {};
        let currentChatId = localStorage.getItem('deeprwa_current_chat') || null;
        let isSending = false;
        let isCreatingNewChat = false;
        let deleteTargetId = null;
        let currentDropdownId = null;
        let isSidebarOpen = true;

        // NO DEFAULT CHAT - empty state on first visit
        if (Object.keys(chats).length === 0) {
            currentChatId = null;
            localStorage.removeItem('deeprwa_current_chat');
        }

        function saveChats() {
            localStorage.setItem('deeprwa_chats', JSON.stringify(chats));
        }

        function isChatEmpty(chatId) {
            const chat = chats[chatId];
            return chat && (!chat.messages || chat.messages.length === 0);
        }

        function updateHeaderVisibility() {
            const header = document.getElementById('mainHeader');
            header.classList.toggle('has-logo', !isSidebarOpen);
        }

        // ===== RENDER CHAT MESSAGES =====
        function renderChatMessages() {
            const chatArea = document.getElementById('chatArea');
            
            if (!currentChatId || !chats[currentChatId] || !chats[currentChatId].messages || chats[currentChatId].messages.length === 0) {
                chatArea.innerHTML = `
                    <div class="empty-state">
                        <h2>DeepRWA</h2>
                        <p>Your AI assistant for Rwanda. Where should we start right now?</p>
                    </div>
                `;
                return;
            }

            const messages = chats[currentChatId].messages;
            let html = '';
            for (const msg of messages) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                html += `
                    <div class="chat-message ${msg.role}">
                        ${msg.content}
                        <span class="timestamp">${time}</span>
                    </div>
                `;
            }
            chatArea.innerHTML = html;
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // ===== RENDER CHAT LIST =====
        function renderChatList() {
            const list = document.getElementById('chatList');
            const mobileList = document.getElementById('mobileChatList');
            const keys = Object.keys(chats);

            if (keys.length === 0) {
                const msg = '<div style="color:#6e6e72;padding:20px;text-align:center;font-size:13px;">No chats yet.</div>';
                list.innerHTML = msg;
                mobileList.innerHTML = msg;
                return;
            }

            keys.sort((a, b) => {
                if (chats[a].pinned && !chats[b].pinned) return -1;
                if (!chats[a].pinned && chats[b].pinned) return 1;
                return new Date(chats[b].created) - new Date(chats[a].created);
            });

            let html = '';
            for (const key of keys) {
                const chat = chats[key];
                const isActive = key === currentChatId;
                const pinIcon = chat.pinned ? '📌' : '';
                const isDeletable = keys.length > 1;
                html += `
                    <div class="chat-item ${isActive ? 'active' : ''}" onclick="switchChat('${key}')">
                        <span class="chat-name">${pinIcon} ${chat.name}</span>
                        <span class="time">${chat.time}</span>
                        <button class="more-btn" onclick="event.stopPropagation();toggleDropdown('${key}', event)">⋯</button>
                        <div class="dropdown-menu" id="dropdown_${key}">
                            <button onclick="handleChatAction('share', '${key}')">Share</button>
                            <button onclick="handleChatAction('pin', '${key}')">${chat.pinned ? 'Unpin' : 'Pin'}</button>
                            ${isDeletable ? `<button class="delete" onclick="handleChatAction('delete', '${key}')">Delete</button>` : ''}
                        </div>
                    </div>
                `;
            }

            list.innerHTML = html;
            mobileList.innerHTML = html;
        }

        // ===== SWITCH CHAT =====
        function switchChat(id) {
            if (id === currentChatId) return;
            currentChatId = id;
            localStorage.setItem('deeprwa_current_chat', id);
            renderChatList();
            renderChatMessages();
            closeMobileSidebar();
            updateSendButton();
        }

        // ===== CREATE NEW CHAT =====
        function createNewChat() {
            if (isCreatingNewChat) return;

            // If no chat exists, create one
            if (!currentChatId || !chats[currentChatId]) {
                const id = 'chat_' + Date.now();
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                chats[id] = {
                    id: id,
                    name: 'New Chat',
                    created: now.toISOString(),
                    time: timeStr,
                    messages: [],
                    pinned: false
                };
                currentChatId = id;
                localStorage.setItem('deeprwa_current_chat', id);
                saveChats();
                renderChatList();
                renderChatMessages();
                closeMobileSidebar();
                return;
            }

            // Check if there's already an empty chat
            for (const key in chats) {
                if (isChatEmpty(key)) {
                    switchChat(key);
                    return;
                }
            }

            // ONLY create new if current chat has messages (NOT empty)
            if (!isChatEmpty(currentChatId)) {
                isCreatingNewChat = true;
                const id = 'chat_' + Date.now();
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                chats[id] = {
                    id: id,
                    name: 'New Chat',
                    created: now.toISOString(),
                    time: timeStr,
                    messages: [],
                    pinned: false
                };
                currentChatId = id;
                localStorage.setItem('deeprwa_current_chat', id);
                saveChats();
                renderChatList();
                renderChatMessages();
                closeMobileSidebar();
                setTimeout(() => { isCreatingNewChat = false; }, 500);
            }
        }

        // ===== TOGGLE DROPDOWN =====
        function toggleDropdown(id, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }

            if (currentDropdownId && currentDropdownId !== id) {
                const old = document.getElementById('dropdown_' + currentDropdownId);
                if (old) old.classList.remove('active');
            }

            const dropdown = document.getElementById('dropdown_' + id);
            if (!dropdown) return;

            if (currentDropdownId === id) {
                dropdown.classList.remove('active');
                currentDropdownId = null;
            } else {
                dropdown.classList.add('active');
                currentDropdownId = id;
            }
        }

        function closeDropdown() {
            if (currentDropdownId) {
                const dropdown = document.getElementById('dropdown_' + currentDropdownId);
                if (dropdown) dropdown.classList.remove('active');
                currentDropdownId = null;
            }
        }

        // ===== HANDLE CHAT ACTIONS =====
        function handleChatAction(action, id) {
            closeDropdown();
            if (action === 'share') openShareModal(id);
            else if (action === 'pin') togglePin(id);
            else if (action === 'delete') openDeleteModal(id);
        }

        // ===== DELETE CHAT =====
        function openDeleteModal(id) {
            if (Object.keys(chats).length <= 1) return;
            deleteTargetId = id;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deleteTargetId = null;
        }

        function confirmDelete() {
            if (deleteTargetId) {
                delete chats[deleteTargetId];
                const keys = Object.keys(chats);
                if (keys.length > 0) {
                    currentChatId = keys[0];
                } else {
                    currentChatId = null;
                    localStorage.removeItem('deeprwa_current_chat');
                }
                localStorage.setItem('deeprwa_current_chat', currentChatId);
                saveChats();
                renderChatList();
                renderChatMessages();
            }
            closeDeleteModal();
        }

        // ===== PIN CHAT =====
        function togglePin(id) {
            if (chats[id]) {
                chats[id].pinned = !chats[id].pinned;
                saveChats();
                renderChatList();
            }
        }

        // ===== SHARE CHAT =====
        function openShareModal(id) {
            const url = window.location.href + '?chat=' + id;
            document.getElementById('shareLinkInput').value = url;
            document.getElementById('shareModal').classList.add('active');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.remove('active');
        }

        function copyShareLink() {
            const input = document.getElementById('shareLinkInput');
            input.select();
            document.execCommand('copy');
            const btn = input.nextElementSibling;
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
        }

        // ===== UPDATE SEND BUTTON =====
        function updateSendButton() {
            const input = document.getElementById('chatInput');
            const btn = document.getElementById('sendBtn');
            const hasText = input.value.trim().length > 0;
            
            if (isSending) {
                btn.textContent = 'Stop';
                btn.className = 'send-btn sending';
                return;
            }
            
            if (hasText) {
                btn.textContent = 'Send';
                btn.className = 'send-btn active';
            } else {
                btn.textContent = 'Send';
                btn.className = 'send-btn';
            }
        }

        // ===== SEND MESSAGE =====
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message || isSending) return;

            // If no chat exists, create one
            if (!currentChatId || !chats[currentChatId]) {
                const id = 'chat_' + Date.now();
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                chats[id] = {
                    id: id,
                    name: 'New Chat',
                    created: now.toISOString(),
                    time: timeStr,
                    messages: [],
                    pinned: false
                };
                currentChatId = id;
                localStorage.setItem('deeprwa_current_chat', id);
                saveChats();
                renderChatList();
            }

            // Add user message
            if (!chats[currentChatId].messages) chats[currentChatId].messages = [];
            chats[currentChatId].messages.push({ role: 'user', content: message });
            
            // Update chat name if it's the first message
            if (chats[currentChatId].name === 'New Chat') {
                const name = message.length > 25 ? message.substring(0, 25) + '...' : message;
                chats[currentChatId].name = name;
            }
            
            saveChats();
            renderChatMessages();
            renderChatList();

            // Clear input
            input.value = '';
            updateSendButton();

            // Set sending state
            isSending = true;
            updateSendButton();

            // Get AI response
            getAIResponse(message);
        }

        // ===== GET AI RESPONSE =====
        function getAIResponse(userMessage) {
            // Build conversation history
            const messages = [
                { role: 'system', content: SYSTEM_PROMPT }
            ];
            
            // Add chat history (last 20 messages)
            const chatMessages = chats[currentChatId].messages || [];
            const lastMessages = chatMessages.slice(-20);
            for (const msg of lastMessages) {
                messages.push({ role: msg.role, content: msg.content });
            }

            // Use a free AI API (DeepSeek)
            fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer sk-...' // You'll need to add your own key
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: messages,
                    temperature: 0.7,
                    max_tokens: 800
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('API request failed');
                }
                return response.json();
            })
            .then(data => {
                const response = data.choices[0].message.content;
                addAssistantMessage(response);
            })
            .catch(error => {
                // Fallback responses if API fails
                const fallback = getFallbackResponse(userMessage);
                addAssistantMessage(fallback);
            });
        }

        // ===== ADD ASSISTANT MESSAGE =====
        function addAssistantMessage(content) {
            if (!currentChatId || !chats[currentChatId]) return;
            
            if (!chats[currentChatId].messages) chats[currentChatId].messages = [];
            chats[currentChatId].messages.push({ role: 'assistant', content: content });
            saveChats();
            renderChatMessages();
            renderChatList();
            
            isSending = false;
            updateSendButton();
        }

        // ===== FALLBACK RESPONSES =====
        function getFallbackResponse(userInput) {
            const lower = userInput.toLowerCase();
            
            if (lower.includes('capital') && lower.includes('rwanda')) {
                return 'The capital of Rwanda is **Kigali**. It is the country\'s political, economic, and cultural center.';
            }
            if (lower.includes('culture') && lower.includes('rwanda')) {
                return 'Rwanda has a rich cultural heritage! Traditional Intore dance, vibrant arts and crafts, and community values like Umuganda (community work) are central to Rwandan culture.';
            }
            if (lower.includes('paul kagame')) {
                return 'Paul Kagame is the President of Rwanda. He has been instrumental in Rwanda\'s remarkable development and transformation since 1994.';
            }
            if (lower.includes('tourism') || lower.includes('tourist')) {
                return 'Rwanda is famous for its mountain gorillas in Volcanoes National Park, beautiful Lake Kivu, Nyungwe Forest, and Akagera National Park for wildlife safaris!';
            }
            if (lower.includes('history') && lower.includes('rwanda')) {
                return 'Rwanda has a complex and rich history, from the ancient Kingdom of Rwanda to independence in 1962, and its remarkable recovery and development since 1994.';
            }
            if (lower.includes('hello') || lower.includes('hi')) {
                return 'Hello! 👋 I\'m DeepRWA, your AI assistant for Rwanda. How can I help you explore Rwanda today?';
            }
            if (lower.includes('rwanda')) {
                return 'I\'m here to help with anything about Rwanda! Feel free to ask me about its culture, history, tourism, famous people, or any specific topic you\'re curious about.';
            }
            
            return 'I\'m DeepRWA, specialized in Rwanda. I can help you with Rwandan culture, history, tourism, famous people, and more. What would you like to know about Rwanda?';
        }

        // ===== TOGGLE SIDEBAR =====
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            document.getElementById('desktopSidebar').classList.toggle('closed', !isSidebarOpen);
            updateHeaderVisibility();
        }

        function openMobileSidebar() {
            document.getElementById('mobileSidebar').classList.add('active');
            document.getElementById('mobileOverlay').classList.add('active');
        }

        function closeMobileSidebar() {
            document.getElementById('mobileSidebar').classList.remove('active');
            document.getElementById('mobileOverlay').classList.remove('active');
        }

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', function() {
            renderChatList();
            renderChatMessages();
            updateHeaderVisibility();
            updateSendButton();

            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');

            input.addEventListener('input', updateSendButton);

            sendBtn.addEventListener('click', function() {
                if (isSending) {
                    isSending = false;
                    updateSendButton();
                } else {
                    sendMessage();
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (isSending) {
                        isSending = false;
                        updateSendButton();
                    } else {
                        sendMessage();
                    }
                }
            });

            // Click outside dropdown closes it
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.more-btn') && !e.target.closest('.dropdown-menu')) {
                    closeDropdown();
                }
            });

            // Focus input
            setTimeout(() => input.focus(), 500);

            // Hide loading overlay
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('hidden');
        });

        // Handle reload/restore state
        window.addEventListener('load', function() {
            renderChatList();
            renderChatMessages();
            updateSendButton();
        });
    </script>
</body>
</html>
