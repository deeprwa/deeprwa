<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRWA</title>
    <link rel="icon" href="av.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #343541;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: #ececf1;
        }
        
        .sidebar {
            width: 260px;
            background: #202123;
            display: flex;
            flex-direction: column;
            padding: 12px;
            flex-shrink: 0;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #2d2d30;
            transition: transform 0.3s ease;
        }
        
        .sidebar.closed {
            transform: translateX(-100%);
            width: 0;
            padding: 0;
            overflow: hidden;
            border: none;
        }
        
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #4a4a4d; border-radius: 4px; }
        
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 14px 4px;
            border-bottom: 1px solid #2d2d30;
            margin-bottom: 10px;
        }
        
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar-logo img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        
        .sidebar-logo span {
            font-size: 16px;
            font-weight: 600;
            color: #ececf1;
        }
        
        .sidebar-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .sidebar-icon {
            background: none;
            border: none;
            color: #6e6e72;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 6px;
            transition: color 0.2s;
            border-radius: 4px;
        }
        
        .sidebar-icon:hover {
            color: #ececf1;
            background: #2d2d30;
        }
        
        .new-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 14px;
            background: transparent;
            border: 1px solid #3d3d40;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 400;
            color: #ececf1;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 12px;
        }
        
        .new-chat-btn:hover {
            background: #2d2d30;
            border-color: #5a5a5e;
        }
        
        .new-chat-btn span {
            font-size: 18px;
            font-weight: 300;
            color: #a0a0a5;
        }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .chat-list::-webkit-scrollbar { width: 4px; }
        .chat-list::-webkit-scrollbar-thumb { background: #4a4a4d; border-radius: 4px; }
        
        .chat-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #ececf1;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            margin-bottom: 2px;
            position: relative;
        }
        
        .chat-item:hover { background: #2d2d30; }
        .chat-item.active { background: #2d2d30; }
        
        .chat-item .chat-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .chat-item .time {
            font-size: 11px;
            color: #6e6e72;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .chat-item .item-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .chat-item:hover .item-actions { opacity: 1; }
        
        .chat-item .item-btn {
            background: none;
            border: none;
            color: #6e6e72;
            cursor: pointer;
            font-size: 13px;
            padding: 0 4px;
            transition: color 0.2s;
        }
        
        .chat-item .item-btn:hover { color: #ececf1; }
        .chat-item .item-btn.delete:hover { color: #e74c3c; }
        
        .sidebar-footer {
            padding-top: 12px;
            border-top: 1px solid #2d2d30;
            font-size: 12px;
            color: #6e6e72;
            text-align: center;
        }
        
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #343541;
        }
        
        .main-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 12px 24px;
            border-bottom: 1px solid #2d2d30;
            flex-shrink: 0;
            background: #343541;
            height: 60px;
        }
        
        .agent-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #343541;
        }
        
        .agent-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #343541;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #343541;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 16px;
            transition: opacity 0.3s ease;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #2d2d30;
            border-top-color: #ececf1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .loading-text {
            color: #6e6e72;
            font-size: 14px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.active { display: flex; }
        
        .modal {
            background: #2d2d30;
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        .modal h3 {
            color: #ececf1;
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .modal p {
            color: #a0a0a5;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        
        .modal-buttons button {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .modal-buttons .cancel-btn {
            background: #3d3d40;
            color: #ececf1;
        }
        
        .modal-buttons .cancel-btn:hover { background: #4a4a4d; }
        
        .modal-buttons .confirm-btn {
            background: #e74c3c;
            color: white;
        }
        
        .modal-buttons .confirm-btn:hover { background: #c0392b; }
        
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: #ececf1;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
        }
        
        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        
        .mobile-overlay.active { display: block; }
        
        .mobile-sidebar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: #202123;
            z-index: 1000;
            padding: 12px;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        
        .mobile-sidebar.active {
            transform: translateX(0);
            display: block;
        }
        
        .mobile-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .mobile-sidebar-header .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #ececf1;
        }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-toggle { display: flex; }
            .main-header { padding: 10px 16px; justify-content: space-between; }
            .main-header .header-title {
                display: block;
                font-size: 16px;
                font-weight: 600;
                color: #ececf1;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading DeepRWA...</div>
    </div>
    
    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h3>Delete this chat?</h3>
            <p>This action cannot be undone.</p>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeDeleteModal()">Cancel</button>
                <button class="confirm-btn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
    
    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="closeMobileSidebar()"></div>
    
    <!-- Mobile Sidebar -->
    <div class="mobile-sidebar" id="mobileSidebar">
        <div class="mobile-sidebar-header">
            <div class="sidebar-logo" style="border:none;margin:0;padding:0;">
                <img src="av.png" alt="DeepRWA">
                <span>DeepRWA</span>
            </div>
            <button class="close-btn" onclick="closeMobileSidebar()">✕</button>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">
            <span>+</span> New Chat
        </button>
        <div class="chat-list" id="mobileChatList"></div>
        <div class="sidebar-footer">DeepRWA · Your AI Assistant</div>
    </div>
    
    <!-- Desktop Sidebar -->
    <div class="sidebar" id="desktopSidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="av.png" alt="DeepRWA">
                <span>DeepRWA</span>
            </div>
            <div class="sidebar-icons">
                <button class="sidebar-icon" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>
            </div>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">
            <span>+</span> New Chat
        </button>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer">DeepRWA · Your AI Assistant</div>
    </div>
    
    <!-- Main Chat Area -->
    <div class="main-chat">
        <div class="main-header">
            <button class="mobile-toggle" onclick="openMobileSidebar()">☰</button>
            <span class="header-title">DeepRWA</span>
        </div>
        <div class="agent-container" id="agentContainer">
            <iframe id="agentFrame" src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431" allow="clipboard-read; clipboard-write"></iframe>
        </div>
    </div>

    <script>
        // ============ CONFIGURATION ============
        const TASKADE_LINK = "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";
        let isCreatingNewChat = false;
        let deleteTargetId = null;
        let isSidebarOpen = true;
        let isLoading = true;
        
        // ============ CHAT MANAGEMENT ============
        let chats = JSON.parse(localStorage.getItem('deeprwa_chats')) || {};
        let currentChatId = localStorage.getItem('deeprwa_current_chat') || null;
        
        // If no chats exist, start empty
        if (Object.keys(chats).length === 0) {
            currentChatId = null;
            localStorage.removeItem('deeprwa_current_chat');
        }
        
        function saveChats() {
            localStorage.setItem('deeprwa_chats', JSON.stringify(chats));
        }
        
        function isChatEmpty(chatId) {
            const chat = chats[chatId];
            return chat && (!chat.messages || chat.messages.length === 0);
        }
        
        function createNewChat() {
            if (isCreatingNewChat) return;
            
            // If there's a current chat and it's empty, don't create a new one
            if (currentChatId && isChatEmpty(currentChatId)) {
                return;
            }
            
            // Check if there's already an empty chat
            for (const key in chats) {
                if (isChatEmpty(key)) {
                    switchChat(key);
                    return;
                }
            }
            
            isCreatingNewChat = true;
            
            const id = 'chat_' + Date.now();
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            
            chats[id] = {
                id: id,
                name: 'New Chat',
                created: now.toISOString(),
                time: timeStr,
                messages: []
            };
            
            currentChatId = id;
            localStorage.setItem('deeprwa_current_chat', id);
            saveChats();
            renderChatList();
            updateAgent();
            closeMobileSidebar();
            
            setTimeout(() => {
                isCreatingNewChat = false;
            }, 500);
        }
        
        function openDeleteModal(id) {
            if (Object.keys(chats).length <= 1) return;
            deleteTargetId = id;
            document.getElementById('deleteModal').classList.add('active');
        }
        
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deleteTargetId = null;
        }
        
        function confirmDelete() {
            if (deleteTargetId) {
                delete chats[deleteTargetId];
                const keys = Object.keys(chats);
                if (keys.length > 0) {
                    currentChatId = keys[0];
                } else {
                    currentChatId = null;
                    localStorage.removeItem('deeprwa_current_chat');
                }
                localStorage.setItem('deeprwa_current_chat', currentChatId);
                saveChats();
                renderChatList();
                updateAgent();
            }
            closeDeleteModal();
        }
        
        function switchChat(id) {
            if (id === currentChatId) return;
            currentChatId = id;
            localStorage.setItem('deeprwa_current_chat', id);
            renderChatList();
            updateAgent();
            closeMobileSidebar();
        }
        
        function updateChatName(id, firstMessage) {
            if (chats[id] && chats[id].name === 'New Chat') {
                const name = firstMessage.length > 25 ? firstMessage.substring(0, 25) + '...' : firstMessage;
                chats[id].name = name;
                chats[id].messages = chats[id].messages || [];
                chats[id].messages.push({ role: 'user', content: firstMessage });
                saveChats();
                renderChatList();
            }
        }
        
        function renderChatList() {
            const list = document.getElementById('chatList');
            const mobileList = document.getElementById('mobileChatList');
            const keys = Object.keys(chats);
            
            keys.sort((a, b) => {
                return new Date(chats[b].created) - new Date(chats[a].created);
            });
            
            let html = '';
            if (keys.length === 0) {
                html = '<div style="color:#6e6e72;padding:20px;text-align:center;font-size:13px;">No chats yet.<br>Click "New Chat" to start.</div>';
            } else {
                for (const key of keys) {
                    const chat = chats[key];
                    const isActive = key === currentChatId;
                    const timeStr = chat.time || '--:--';
                    const name = chat.name || 'New Chat';
                    const isDeletable = keys.length > 1;
                    html += `
                        <div class="chat-item ${isActive ? 'active' : ''}" onclick="switchChat('${key}')">
                            <span class="chat-name">💬 ${name}</span>
                            <span class="time">${timeStr}</span>
                            <div class="item-actions">
                                ${isDeletable ? `<button class="item-btn delete" onclick="event.stopPropagation();openDeleteModal('${key}')">✕</button>` : ''}
                            </div>
                        </div>
                    `;
                }
            }
            
            list.innerHTML = html;
            mobileList.innerHTML = html;
        }
        
        function updateAgent() {
            const frame = document.getElementById('agentFrame');
            frame.src = TASKADE_LINK + '?t=' + Date.now();
            
            // Show loading overlay
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');
            isLoading = true;
            
            frame.onload = function() {
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    isLoading = false;
                }, 400);
            };
            
            // Fallback: hide after 2.5 seconds
            setTimeout(() => {
                overlay.classList.add('hidden');
                isLoading = false;
            }, 2500);
        }
        
        function toggleSidebar() {
            const sidebar = document.getElementById('desktopSidebar');
            isSidebarOpen = !isSidebarOpen;
            sidebar.classList.toggle('closed', !isSidebarOpen);
        }
        
        function openMobileSidebar() {
            document.getElementById('mobileSidebar').classList.add('active');
            document.getElementById('mobileOverlay').classList.add('active');
        }
        
        function closeMobileSidebar() {
            document.getElementById('mobileSidebar').classList.remove('active');
            document.getElementById('mobileOverlay').classList.remove('active');
        }
        
        // Listen for messages from the iframe
        window.addEventListener('message', function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.type === 'user_message' && data.message) {
                    // If no chat exists, create one when user sends first message
                    if (!currentChatId || !chats[currentChatId]) {
                        const id = 'chat_' + Date.now();
                        const now = new Date();
                        const timeStr = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
                        chats[id] = {
                            id: id,
                            name: 'New Chat',
                            created: now.toISOString(),
                            time: timeStr,
                            messages: []
                        };
                        currentChatId = id;
                        localStorage.setItem('deeprwa_current_chat', id);
                        saveChats();
                        renderChatList();
                    }
                    updateChatName(currentChatId, data.message);
                }
            } catch (e) {}
        });
        
        // ============ INITIALIZE ============
        renderChatList();
        
        // Show loading overlay on initial load
        const overlay = document.getElementById('loadingOverlay');
        overlay.classList.remove('hidden');
        
        // Hide loading after page loads
        window.addEventListener('load', function() {
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 800);
        });
        
        // Fallback: hide after 3 seconds
        setTimeout(() => {
            overlay.classList.add('hidden');
        }, 3000);
    </script>
</body>
</html>
