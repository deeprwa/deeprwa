<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>DeepRWA</title>

    <link rel="icon" href="av.png" type="image/png">

    <style>

        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================================
           THEME VARIABLES
           ========================================================= */

        :root {

            /* Outer page background */
            --outer-theme: #1e1e1f;

            /* Desktop central chat width */
            --desktop-chat-width: 672px;

            /* Desktop top spacing */
            --desktop-chat-top: 40px;

            /*
             * IMPORTANT:
             *
             * This is NOT 72px anymore.
             *
             * 36px is intentionally used so that:
             *
             *     DeepRWA can make a mistake.
             *
             * remains visible.
             *
             * Only the "Powered by Taskade" row is covered.
             */
            --footer-hide-height: 36px;

            /* Tablet footer */
            --tablet-footer-height: 48px;
        }


        /* =========================================================
           HTML
           ========================================================= */

        html {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme);

            overflow: hidden;
        }


        /* =========================================================
           BODY
           ========================================================= */

        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            position: relative;

            overflow: hidden;

            background: var(--outer-theme) !important;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #ececf1;

            /*
             * Safe area support for phones with gesture/navigation
             * areas and display cutouts.
             */
            padding-bottom: env(safe-area-inset-bottom);
        }


        /* =========================================================
           FULL PAGE BACKGROUND
           ========================================================= */

        .page-background {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: var(--outer-theme);

            z-index: 0;

            pointer-events: none;
        }


        /* =========================================================
           TASKADE CONTAINER
           ========================================================= */

        .agent-container {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme) !important;

            border: 0;
            outline: 0;

            z-index: 1;

            overflow: hidden;
        }


        /* =========================================================
           TASKADE IFRAME
           ========================================================= */

        .agent-container iframe {
            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: transparent !important;

            z-index: 1;
        }


        /* =========================================================
           DESKTOP OUTER THEME — TOP
           ========================================================= */

        .outer-top {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: var(--desktop-chat-top);

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER THEME — LEFT
           ========================================================= */

        .outer-left {
            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--tablet-footer-height);

            left: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER THEME — RIGHT
           ========================================================= */

        .outer-right {
            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--tablet-footer-height);

            right: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           TASKADE BRANDING COVER

           THIS IS THE IMPORTANT PART.

           The Taskade iframe is cross-origin, so we cannot reach
           inside it and remove the "Powered by Taskade" element.

           Instead, this very small cover sits ONLY over the bottom
           branding row.

           36px is deliberately chosen so the disclaimer above it
           remains visible.
           ========================================================= */

        .footer-cover {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: var(--footer-hide-height);

            background: var(--outer-theme) !important;

            z-index: 30;

            /*
             * This visual cover does not itself need to receive
             * clicks. The footer-blocker below handles that.
             */
            pointer-events: none;

            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;

            border: 0;
            outline: 0;

            box-shadow: none;

            /*
             * Prevent any accidental visual interaction.
             */
            touch-action: none;
        }


        /* =========================================================
           FOOTER CLICK / TOUCH BLOCKER

           IMPORTANT:

           If somebody taps/clicks the dark area where "Powered by
           Taskade" used to be, the event is stopped here.

           Therefore it cannot activate the Taskade branding link.
           ========================================================= */

        .footer-blocker {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: var(--footer-hide-height);

            z-index: 31;

            background: transparent;

            pointer-events: auto;

            cursor: default;

            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;

            touch-action: none;

            -webkit-touch-callout: none;
        }


        /* =========================================================
           LOADING OVERLAY
           ========================================================= */

        .loading-overlay {
            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 16px;

            background: var(--outer-theme) !important;

            z-index: 50;

            opacity: 1;

            transition:
                opacity 0.5s ease;
        }


        .loading-overlay.hidden {
            opacity: 0;

            pointer-events: none;
        }


        /* =========================================================
           LOADING SPINNER
           ========================================================= */

        .loading-spinner {
            width: 44px;
            height: 44px;

            border: 3px solid #2d2d30;

            border-top-color: #ececf1;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        .loading-text {
            color: #6e6e72;

            font-size: 14px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================================================
           TABLETS
           ========================================================= */

        @media (min-width: 769px) and (max-width: 1100px) {

            :root {

                --desktop-chat-top: 32px;

                /*
                 * Keep the central chat responsive.
                 */
                --desktop-chat-width:
                    min(
                        672px,
                        calc(100vw - 32px)
                    );

                /*
                 * This affects the side-mask geometry only.
                 */
                --tablet-footer-height: 48px;
            }


            /*
             * The branding cover itself remains 36px.
             *
             * We do NOT increase it to 48px because that could
             * hide the disclaimer.
             */
            .footer-cover,
            .footer-blocker {
                height: var(--footer-hide-height);
            }

        }


        /* =========================================================
           MOBILE DEVICES
           ========================================================= */

        @media (max-width: 768px) {

            html,
            body {
                width: 100%;
                height: 100%;

                overflow: hidden;

                background: var(--outer-theme) !important;
            }


            /*
             * Disable desktop side masks on phones.
             *
             * This prevents the desktop 672px geometry from
             * interfering with Taskade's responsive mobile layout.
             */
            .outer-top,
            .outer-left,
            .outer-right {
                display: none;
            }


            /*
             * IMPORTANT:
             *
             * DO NOT disable the footer cover on mobile.
             *
             * We need the small 36px cover to hide only
             * "Powered by Taskade".
             *
             * The previous version disabled it completely,
             * which allowed the Taskade branding to remain visible.
             */
            .footer-cover,
            .footer-blocker {
                display: block;

                height: var(--footer-hide-height);
            }


            /*
             * Full mobile Taskade experience.
             */
            .agent-container {
                position: fixed;

                top: 0;
                left: 0;
                right: 0;
                bottom: 0;

                width: 100%;
                height: 100%;

                overflow: hidden;

                background: var(--outer-theme) !important;
            }


            /*
             * Responsive iframe.
             */
            .agent-container iframe {
                position: absolute;

                top: 0;
                left: 0;
                right: 0;
                bottom: 0;

                width: 100%;
                height: 100%;

                border: 0;

                background: transparent !important;
            }

        }


        /* =========================================================
           SMALL PHONES
           ========================================================= */

        @media (max-width: 480px) {

            /*
             * Keep the Taskade interface completely responsive.
             */
            .agent-container,
            .agent-container iframe {
                width: 100%;
                height: 100%;
            }


            /*
             * Still hide ONLY the Taskade branding row.
             */
            .footer-cover,
            .footer-blocker {
                display: block;

                height: 36px;
            }

        }


        /* =========================================================
           LANDSCAPE PHONES
           ========================================================= */

        @media (max-width: 900px) and (orientation: landscape) {

            /*
             * No desktop geometry.
             */
            .outer-top,
            .outer-left,
            .outer-right {
                display: none;
            }


            /*
             * Keep the small branding cover.
             *
             * It remains only 36px so the actual Taskade controls
             * are not unnecessarily covered.
             */
            .footer-cover,
            .footer-blocker {
                display: block;

                height: 36px;
            }


            .agent-container,
            .agent-container iframe {
                width: 100%;
                height: 100%;
            }

        }


        /* =========================================================
           TOUCH DEVICES
           ========================================================= */

        @media (hover: none) and (pointer: coarse) {

            /*
             * DO NOT remove the footer blocker.
             *
             * Touch devices must also be prevented from opening
             * the hidden Taskade branding link.
             */
            .footer-cover,
            .footer-blocker {
                display: block;

                height: 36px;

                touch-action: none;
            }

        }


        /* =========================================================
           HIDE OUTER PAGE SCROLLBAR
           ========================================================= */

        ::-webkit-scrollbar {
            display: none;
        }

    </style>
</head>


<body>

    <!-- =========================================================
         FULL PAGE BACKGROUND
         ========================================================= -->

    <div
        class="page-background"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         TASKADE AGENT
         ========================================================= -->

    <div
        class="agent-container"
        id="agentContainer"
    >

        <!-- =====================================================
             LOADING OVERLAY
             ===================================================== -->

        <div
            class="loading-overlay"
            id="loadingOverlay"
        >

            <div class="loading-spinner"></div>

            <div class="loading-text">
                Loading DeepRWA...
            </div>

        </div>


        <!-- =====================================================
             TASKADE IFRAME
             ===================================================== -->

        <iframe
            id="agentFrame"
            src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431"
            allow="clipboard-read; clipboard-write"
            title="DeepRWA AI Assistant">
        </iframe>

    </div>


    <!-- =========================================================
         DESKTOP OUTER THEME
         ========================================================= -->

    <div
        class="outer-top"
        aria-hidden="true">
    </div>


    <div
        class="outer-left"
        aria-hidden="true">
    </div>


    <div
        class="outer-right"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         SMALL BRANDING COVER

         Covers ONLY the "Powered by Taskade" row.
         The disclaimer above remains visible.
         ========================================================= -->

    <div
        class="footer-cover"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         INVISIBLE CLICK / TOUCH BLOCKER

         Prevents interaction with the hidden Taskade branding.
         ========================================================= -->

    <div
        class="footer-blocker"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>

        const AGENT_URL =
            "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";


        /* =========================================================
           LOADING HANDLER
           ========================================================= */

        function handleLoading() {

            const overlay =
                document.getElementById("loadingOverlay");

            const iframe =
                document.getElementById("agentFrame");


            if (!overlay || !iframe) {
                return;
            }


            /*
             * Show loading screen initially.
             */
            overlay.classList.remove("hidden");


            /*
             * Hide it once Taskade loads.
             */
            iframe.addEventListener(
                "load",
                function () {

                    setTimeout(
                        function () {

                            overlay.classList.add("hidden");

                        },
                        500
                    );

                },
                {
                    once: true
                }
            );


            /*
             * Safety fallback.
             */
            setTimeout(
                function () {

                    overlay.classList.add("hidden");

                },
                3500
            );
        }


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                handleLoading();

            }
        );

    </script>

</body>
</html>
