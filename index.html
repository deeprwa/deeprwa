<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>DeepRWA</title>

    <link rel="icon" href="av.png" type="image/png">

    <style>

        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================================
           THEME VARIABLES
           ========================================================= */

        :root {

            /*
             * Outer page theme.
             *
             * This is the dark gray surrounding the Taskade
             * central chat area.
             */
            --outer-theme: #1e1e1f;


            /*
             * Desktop central Taskade panel.
             *
             * 672px matches the desktop appearance you supplied.
             */
            --desktop-chat-width: 672px;


            /*
             * Desktop top distance.
             *
             * IMPORTANT:
             * This is CSS viewport space, NOT screenshot space.
             */
            --desktop-chat-top: 40px;


            /*
             * Desktop bottom cover.
             *
             * Kept for the laptop layout that is currently
             * looking correct.
             */
            --desktop-footer-height: 72px;


            /*
             * Mobile horizontal breathing room.
             */
            --mobile-side-space: 24px;


            /*
             * Mobile top breathing room.
             */
            --mobile-top-space: 24px;
        }


        /* =========================================================
           HTML / BODY
           ========================================================= */

        html {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme);

            overflow: hidden;
        }


        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            position: relative;

            overflow: hidden;

            background: var(--outer-theme) !important;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #ececf1;

            /*
             * Helps mobile browsers account for notches and
             * rounded display areas.
             */
            padding-bottom: env(safe-area-inset-bottom);
        }


        /* =========================================================
           FULL PAGE BACKGROUND
           ========================================================= */

        .page-background {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: var(--outer-theme);

            z-index: 0;

            pointer-events: none;
        }


        /* =========================================================
           TASKADE CONTAINER
           ========================================================= */

        .agent-container {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme) !important;

            border: 0;
            outline: 0;

            z-index: 1;

            overflow: hidden;
        }


        /* =========================================================
           TASKADE IFRAME
           ========================================================= */

        .agent-container iframe {
            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: transparent !important;

            z-index: 1;
        }


        /* =========================================================
           DESKTOP OUTER MASK — TOP
           ========================================================= */

        .outer-top {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: var(--desktop-chat-top);

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER MASK — LEFT
           ========================================================= */

        .outer-left {
            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--desktop-footer-height);

            left: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER MASK — RIGHT
           ========================================================= */

        .outer-right {
            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--desktop-footer-height);

            right: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP BOTTOM COVER
           ========================================================= */

        .footer-cover {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: var(--desktop-footer-height);

            background: var(--outer-theme) !important;

            z-index: 20;

            pointer-events: none;

            user-select: none;

            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;

            border: 0;
            outline: 0;

            box-shadow: none;
        }


        /* =========================================================
           DESKTOP FOOTER BLOCKER
           ========================================================= */

        .footer-blocker {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: var(--desktop-footer-height);

            background: transparent;

            z-index: 21;

            pointer-events: auto;

            cursor: default;

            /*
             * Prevent accidental selection/touch behavior.
             */
            user-select: none;
        }


        /* =========================================================
           LOADING OVERLAY
           ========================================================= */

        .loading-overlay {
            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 16px;

            background: var(--outer-theme) !important;

            z-index: 50;

            opacity: 1;

            transition:
                opacity 0.5s ease;
        }


        .loading-overlay.hidden {
            opacity: 0;

            pointer-events: none;
        }


        /* =========================================================
           LOADING SPINNER
           ========================================================= */

        .loading-spinner {
            width: 44px;
            height: 44px;

            border: 3px solid #2d2d30;

            border-top-color: #ececf1;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        .loading-text {
            color: #6e6e72;

            font-size: 14px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================================================
           TABLET
           =========================================================

           Tablets have much less horizontal space than laptops.

           Instead of forcing a 672px central panel, we let the
           panel scale naturally.

           The Taskade iframe itself remains full viewport.
           */

        @media (min-width: 769px) and (max-width: 1100px) {

            :root {

                /*
                 * Smaller top margin for tablet.
                 */
                --desktop-chat-top: 32px;

                /*
                 * Smaller footer so more Taskade content remains
                 * visible.
                 */
                --desktop-footer-height: 48px;

                /*
                 * Give the central panel responsive side space.
                 */
                --desktop-chat-width:
                    min(
                        672px,
                        calc(100vw - 32px)
                    );
            }

        }


        /* =========================================================
           MOBILE
           =========================================================

           IMPORTANT:

           The desktop masks are DISABLED.

           This is intentional.

           On a phone, the Taskade interface is already responsive.
           A fixed 672px desktop mask would cover interface elements
           and make the page look broken.

           We therefore use the iframe normally and only add a
           small responsive top/side visual treatment.
           */

        @media (max-width: 768px) {

            html,
            body {
                width: 100%;
                height: 100%;

                overflow: hidden;

                background: var(--outer-theme) !important;
            }


            /*
             * Hide desktop geometry masks.
             */

            .outer-top,
            .outer-left,
            .outer-right {
                display: none;
            }


            /*
             * IMPORTANT:
             *
             * Do NOT cover the bottom 72px on mobile.
             *
             * The previous version was covering the Taskade
             * message input and lower interface on phones.
             */

            .footer-cover,
            .footer-blocker {
                display: none;
            }


            /*
             * Let the Taskade container use the complete mobile
             * viewport.
             */

            .agent-container {
                position: fixed;

                top: 0;
                left: 0;
                right: 0;
                bottom: 0;

                width: 100%;
                height: 100%;

                overflow: hidden;

                background: var(--outer-theme) !important;
            }


            /*
             * Keep iframe completely responsive.
             */

            .agent-container iframe {
                position: absolute;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                border: 0;

                background: transparent !important;
            }

        }


        /* =========================================================
           VERY SMALL PHONES
           ========================================================= */

        @media (max-width: 480px) {

            /*
             * No desktop overlay geometry.
             */
            .outer-top,
            .outer-left,
            .outer-right,
            .footer-cover,
            .footer-blocker {
                display: none;
            }


            /*
             * Full-width Taskade experience.
             */
            .agent-container,
            .agent-container iframe {
                width: 100%;
                height: 100%;
            }

        }


        /* =========================================================
           LANDSCAPE PHONES
           ========================================================= */

        @media (max-width: 900px) and (orientation: landscape) {

            /*
             * Landscape phones have very little vertical space.
             *
             * Do not place artificial masks over the Taskade
             * interface.
             */

            .outer-top,
            .outer-left,
            .outer-right,
            .footer-cover,
            .footer-blocker {
                display: none;
            }

            .agent-container,
            .agent-container iframe {
                width: 100%;
                height: 100%;
            }

        }


        /* =========================================================
           TOUCH DEVICES
           ========================================================= */

        @media (hover: none) and (pointer: coarse) {

            /*
             * Touch devices should never receive the desktop
             * 72px footer blocker.
             */

            .footer-cover,
            .footer-blocker {
                display: none;
            }

        }


        /* =========================================================
           HIDE SCROLLBAR
           ========================================================= */

        ::-webkit-scrollbar {
            display: none;
        }

    </style>
</head>


<body>


    <!-- =========================================================
         FULL PAGE BACKGROUND
         ========================================================= -->

    <div class="page-background"></div>


    <!-- =========================================================
         TASKADE AGENT
         ========================================================= -->

    <div
        class="agent-container"
        id="agentContainer"
    >

        <!-- =====================================================
             LOADING OVERLAY
             ===================================================== -->

        <div
            class="loading-overlay"
            id="loadingOverlay"
        >

            <div class="loading-spinner"></div>

            <div class="loading-text">
                Loading DeepRWA...
            </div>

        </div>


        <!-- =====================================================
             TASKADE IFRAME
             ===================================================== -->

        <iframe
            id="agentFrame"
            src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431"
            allow="clipboard-read; clipboard-write"
            title="DeepRWA AI Assistant">
        </iframe>

    </div>


    <!-- =========================================================
         DESKTOP OUTER THEME
         =========================================================

         These are intentionally kept OUTSIDE the iframe.

         They only operate on desktop/tablet layouts where the
         central Taskade panel has a constrained width.
         ========================================================= -->

    <div
        class="outer-top"
        aria-hidden="true">
    </div>


    <div
        class="outer-left"
        aria-hidden="true">
    </div>


    <div
        class="outer-right"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         DESKTOP BOTTOM THEME
         ========================================================= -->

    <div
        class="footer-cover"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         DESKTOP FOOTER BLOCKER
         ========================================================= -->

    <div
        class="footer-blocker"
        aria-hidden="true">
    </div>


    <script>

        /* =========================================================
           TASKADE URL
           ========================================================= */

        const AGENT_URL =
            "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";


        /* =========================================================
           LOADING HANDLER
           ========================================================= */

        function handleLoading() {

            const overlay =
                document.getElementById("loadingOverlay");

            const iframe =
                document.getElementById("agentFrame");


            if (!overlay || !iframe) {
                return;
            }


            /*
             * Show loading screen initially.
             */

            overlay.classList.remove("hidden");


            /*
             * Once Taskade finishes loading, gently remove the
             * loading screen.
             */

            iframe.addEventListener(
                "load",
                function () {

                    setTimeout(
                        function () {

                            overlay.classList.add("hidden");

                        },
                        500
                    );

                },
                {
                    once: true
                }
            );


            /*
             * Safety fallback.
             *
             * This prevents a slow iframe from leaving the
             * loading screen permanently visible.
             */

            setTimeout(
                function () {

                    overlay.classList.add("hidden");

                },
                3500
            );
        }


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                handleLoading();

            }
        );

    </script>

</body>
</html>
