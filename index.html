<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>DeepRWA</title>

    <link rel="icon" href="av.png" type="image/png">

    <style>

        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================================
           THEME
           ========================================================= */

        :root {

            /* Outer area surrounding the Taskade chat */
            --outer-theme: #1e1e1f;

            /*
             * Desktop Taskade panel width.
             *
             * Your desktop screenshot shows approximately
             * 672px of central content.
             */
            --desktop-chat-width: 672px;

            /*
             * Distance from browser viewport top to the
             * central Taskade panel.
             */
            --desktop-chat-top: 40px;

            /*
             * IMPORTANT:
             *
             * This is now deliberately SMALL.
             *
             * The old 72px value covered:
             *
             *   "DeepRWA can make a mistake"
             *
             * as well as:
             *
             *   "Powered by Taskade"
             *
             * We only want to hide the latter.
             */
            --desktop-footer-cover-height: 30px;

            /*
             * Tablet footer cover.
             */
            --tablet-footer-cover-height: 30px;

            /*
             * Mobile footer cover.
             *
             * This is intentionally small so that the disclaimer
             * above the Taskade branding remains visible.
             */
            --mobile-footer-cover-height: 32px;

            /*
             * Very small phones.
             */
            --small-phone-footer-cover-height: 34px;
        }


        /* =========================================================
           HTML
           ========================================================= */

        html {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme);

            overflow: hidden;

            /*
             * Prevent mobile browsers from creating an artificial
             * horizontal layout width.
             */
            max-width: 100%;
        }


        /* =========================================================
           BODY
           ========================================================= */

        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            position: relative;

            overflow: hidden;

            background: var(--outer-theme) !important;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #ececf1;

            /*
             * Do NOT add safe-area padding to the body.
             *
             * The iframe must retain the complete viewport.
             */
        }


        /* =========================================================
           FULL PAGE BACKGROUND
           ========================================================= */

        .page-background {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: var(--outer-theme);

            z-index: 0;

            pointer-events: none;
        }


        /* =========================================================
           TASKADE CONTAINER
           ========================================================= */

        .agent-container {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme) !important;

            border: 0;
            outline: 0;

            z-index: 1;

            overflow: hidden;
        }


        /* =========================================================
           TASKADE IFRAME
           ========================================================= */

        .agent-container iframe {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: block;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: transparent !important;

            z-index: 1;

            /*
             * Important:
             *
             * Do NOT disable pointer events.
             *
             * The Taskade chat must remain completely usable.
             */
            pointer-events: auto;
        }


        /* =========================================================
           DESKTOP OUTER AREA — TOP
           ========================================================= */

        .outer-top {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: var(--desktop-chat-top);

            background: var(--outer-theme);

            z-index: 10;

            /*
             * This layer is purely visual.
             */
            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER AREA — LEFT
           ========================================================= */

        .outer-left {

            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--desktop-footer-cover-height);

            left: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER AREA — RIGHT
           ========================================================= */

        .outer-right {

            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--desktop-footer-cover-height);

            right: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           BOTTOM BRANDING COVER
           =========================================================

           WHY THIS IS SMALL:

           Taskade's lower area contains approximately:

              Message input
                    ↓
              "DeepRWA can make a mistake"
                    ↓
              "Powered by Taskade"

           The previous 72px cover was too tall and therefore
           covered BOTH pieces of text.

           This cover is intentionally only around 30px.

           It hides the Taskade branding while leaving the
           disclaimer visible.
           ========================================================= */

        .footer-cover {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: var(--desktop-footer-cover-height);

            background: var(--outer-theme) !important;

            z-index: 20;

            /*
             * IMPORTANT:
             *
             * The cover is visual only.
             *
             * It must NOT block the Taskade input.
             */
            pointer-events: none;

            user-select: none;

            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;

            border: 0;
            outline: 0;

            box-shadow: none;
        }


        /* =========================================================
           FOOTER BLOCKER
           =========================================================

           We intentionally DO NOT use a large blocker anymore.

           The previous blocker caused the lower Taskade interface
           to become unclickable.

           Therefore the blocker is disabled by default.
           ========================================================= */

        .footer-blocker {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: 0;

            background: transparent;

            z-index: 19;

            pointer-events: none;
        }


        /* =========================================================
           LOADING OVERLAY
           ========================================================= */

        .loading-overlay {

            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 16px;

            background: var(--outer-theme) !important;

            z-index: 50;

            opacity: 1;

            transition:
                opacity 0.5s ease;
        }


        .loading-overlay.hidden {

            opacity: 0;

            pointer-events: none;
        }


        /* =========================================================
           LOADING SPINNER
           ========================================================= */

        .loading-spinner {

            width: 44px;
            height: 44px;

            border: 3px solid #2d2d30;

            border-top-color: #ececf1;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        .loading-text {

            color: #6e6e72;

            font-size: 14px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (min-width: 769px) and (max-width: 1100px) {

            :root {

                --desktop-chat-top: 32px;

                /*
                 * Responsive central width.
                 */
                --desktop-chat-width:
                    min(
                        672px,
                        calc(100vw - 32px)
                    );

                /*
                 * Small cover only.
                 */
                --desktop-footer-cover-height: 30px;
            }


            .outer-left,
            .outer-right {

                /*
                 * Keep the central Taskade area visible.
                 */
                bottom: var(--desktop-footer-cover-height);
            }
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 768px) {

            html,
            body {

                width: 100%;
                height: 100%;

                overflow: hidden;

                background: var(--outer-theme) !important;

                /*
                 * Prevent accidental horizontal overflow.
                 */
                max-width: 100%;
            }


            /* -----------------------------------------------------
               REMOVE DESKTOP MASK GEOMETRY
               ----------------------------------------------------- */

            .outer-top,
            .outer-left,
            .outer-right {

                display: none;
            }


            /* -----------------------------------------------------
               MOBILE TASKADE CONTAINER
               ----------------------------------------------------- */

            .agent-container {

                position: fixed;

                top: 0;
                left: 0;
                right: 0;
                bottom: 0;

                width: 100%;
                height: 100%;

                margin: 0;
                padding: 0;

                overflow: hidden;

                background: var(--outer-theme) !important;
            }


            /* -----------------------------------------------------
               MOBILE IFRAME
               ----------------------------------------------------- */

            .agent-container iframe {

                position: absolute;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                margin: 0;
                padding: 0;

                border: 0;

                background: transparent !important;

                pointer-events: auto;
            }


            /* -----------------------------------------------------
               MOBILE BRANDING COVER
               ----------------------------------------------------- */

            .footer-cover {

                position: fixed;

                left: 0;
                right: 0;

                bottom: 0;

                /*
                 * IMPORTANT:
                 *
                 * Only approximately the bottom branding line
                 * is covered.
                 *
                 * The disclaimer immediately above it remains
                 * visible.
                 */
                height: var(--mobile-footer-cover-height);

                background: var(--outer-theme) !important;

                z-index: 20;

                pointer-events: none;

                /*
                 * Extend slightly into the device safe area
                 * without covering the disclaimer.
                 */
                padding-bottom:
                    env(safe-area-inset-bottom);
            }


            /*
             * No interaction blocker.
             */
            .footer-blocker {

                display: none;
            }
        }


        /* =========================================================
           SMALL PHONES
           ========================================================= */

        @media (max-width: 480px) {

            :root {

                /*
                 * Slightly larger than normal mobile because
                 * narrow phones may wrap the Taskade branding
                 * differently.
                 */
                --small-phone-footer-cover-height: 34px;
            }


            .agent-container,
            .agent-container iframe {

                width: 100%;
                height: 100%;
            }


            .footer-cover {

                height:
                    var(--small-phone-footer-cover-height);

                /*
                 * Never allow the cover to become huge because
                 * of device safe-area calculations.
                 */
                max-height: 38px;

                pointer-events: none;
            }
        }


        /* =========================================================
           LANDSCAPE PHONES
           ========================================================= */

        @media (max-width: 900px) and (orientation: landscape) {

            .outer-top,
            .outer-left,
            .outer-right {

                display: none;
            }


            .agent-container,
            .agent-container iframe {

                width: 100%;
                height: 100%;
            }


            /*
             * Landscape has very little vertical space.
             *
             * Keep the cover extremely small.
             */
            .footer-cover {

                height: 28px;

                pointer-events: none;
            }


            .footer-blocker {

                display: none;
            }
        }


        /* =========================================================
           TOUCH DEVICES
           =========================================================

           This is deliberately NOT hiding the footer cover.

           We still need the cover to hide "Powered by Taskade".

           But because it has pointer-events:none, it does not
           interfere with the Taskade interface.
           ========================================================= */

        @media (hover: none) and (pointer: coarse) {

            .footer-cover {

                pointer-events: none;
            }


            .footer-blocker {

                display: none;

                pointer-events: none;
            }
        }


        /* =========================================================
           HIDE PAGE SCROLLBAR
           ========================================================= */

        ::-webkit-scrollbar {

            display: none;
        }

    </style>
</head>


<body>


    <!-- =========================================================
         FULL PAGE BACKGROUND
         ========================================================= -->

    <div
        class="page-background"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         TASKADE AGENT
         ========================================================= -->

    <div
        class="agent-container"
        id="agentContainer">


        <!-- =====================================================
             LOADING OVERLAY
             ===================================================== -->

        <div
            class="loading-overlay"
            id="loadingOverlay">

            <div class="loading-spinner"></div>

            <div class="loading-text">
                Loading DeepRWA...
            </div>

        </div>


        <!-- =====================================================
             TASKADE IFRAME
             ===================================================== -->

        <iframe
            id="agentFrame"
            src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431"
            allow="clipboard-read; clipboard-write"
            title="DeepRWA AI Assistant">
        </iframe>

    </div>


    <!-- =========================================================
         DESKTOP OUTER THEME
         ========================================================= -->

    <div
        class="outer-top"
        aria-hidden="true">
    </div>


    <div
        class="outer-left"
        aria-hidden="true">
    </div>


    <div
        class="outer-right"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         BOTTOM BRANDING COVER
         =========================================================

         This is the ONLY element used to hide the
         "Powered by Taskade" branding.

         It does NOT intercept clicks.
         ========================================================= -->

    <div
        class="footer-cover"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         FOOTER BLOCKER
         =========================================================

         Intentionally empty/inactive.

         This remains in the DOM only for compatibility with
         the previous structure.
         ========================================================= -->

    <div
        class="footer-blocker"
        aria-hidden="true">
    </div>


    <script>

        /* =========================================================
           TASKADE URL
           ========================================================= */

        const AGENT_URL =
            "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";


        /* =========================================================
           LOADING HANDLER
           ========================================================= */

        function handleLoading() {

            const overlay =
                document.getElementById("loadingOverlay");

            const iframe =
                document.getElementById("agentFrame");


            if (!overlay || !iframe) {
                return;
            }


            /*
             * Show loading screen.
             */
            overlay.classList.remove("hidden");


            /*
             * Hide it after Taskade loads.
             */
            iframe.addEventListener(
                "load",
                function () {

                    setTimeout(
                        function () {

                            overlay.classList.add("hidden");

                        },
                        500
                    );

                },
                {
                    once: true
                }
            );


            /*
             * Safety fallback.
             */
            setTimeout(
                function () {

                    overlay.classList.add("hidden");

                },
                3500
            );
        }


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                handleLoading();

            }
        );

    </script>

</body>
</html>
