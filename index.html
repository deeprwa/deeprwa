<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeepRWA</title>

    <link rel="icon" href="av.png" type="image/png">

    <style>

        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================================
           THEME
           ========================================================= */

        :root {
            --outer-theme: #1e1e1f;

            /*
             * Based on the actual browser viewport coordinates,
             * NOT the full screenshot coordinates.
             *
             * The Chrome browser toolbar is outside this page.
             */

            --chat-width: 672px;
            --chat-top: 40px;
            --footer-height: 72px;
        }


        /* =========================================================
           HTML + BODY
           ========================================================= */

        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: var(--outer-theme) !important;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            color: #ececf1;
        }


        body {
            position: relative;
        }


        /* =========================================================
           PARENT PAGE BACKGROUND
           ========================================================= */

        .page-background {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            background: var(--outer-theme);

            z-index: 0;

            pointer-events: none;
        }


        /* =========================================================
           TASKADE CONTAINER
           ========================================================= */

        .agent-container {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme) !important;

            border: 0;
            outline: 0;

            z-index: 1;
        }


        /* =========================================================
           TASKADE IFRAME
           ========================================================= */

        .agent-container iframe {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: transparent !important;

            z-index: 1;
        }


        /* =========================================================
           OUTER THEME — TOP
           =========================================================

           IMPORTANT:

           The original screenshot's chat begins around screen
           Y = 127px.

           The browser toolbar takes approximately 87px.

           Therefore:

               127 - 87 = 40px

           So the CSS top position is 40px.

           This is critical because the previous 127px value
           accidentally covered the DeepRWA header.
        */

        .outer-top {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: var(--chat-top);

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           OUTER THEME — LEFT
           =========================================================

           This covers ONLY the left side of the chat.

           The central chat remains untouched.
        */

        .outer-left {
            position: fixed;

            top: var(--chat-top);
            bottom: var(--footer-height);
            left: 0;

            /*
             * At 1366px viewport width:

                 (1366 - 672) / 2
                 = 347px
             */

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           OUTER THEME — RIGHT
           ========================================================= */

        .outer-right {
            position: fixed;

            top: var(--chat-top);
            bottom: var(--footer-height);
            right: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           BOTTOM FOOTER COVER
           =========================================================

           IMPORTANT:

           Keep this at exactly 72px.

           This leaves the:

               "DeepRWA can make a mistake."

           message visible above it.
        */

        .footer-cover {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: var(--footer-height);

            background: var(--outer-theme) !important;

            z-index: 20;

            pointer-events: none;

            user-select: none;

            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;

            border: 0;
            outline: 0;

            box-shadow: none;
        }


        /* =========================================================
           FOOTER CLICK BLOCKER
           ========================================================= */

        .footer-blocker {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: var(--footer-height);

            z-index: 21;

            background: transparent;

            pointer-events: auto;

            cursor: default;
        }


        /* =========================================================
           LOADING OVERLAY
           ========================================================= */

        .loading-overlay {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 16px;

            background: var(--outer-theme) !important;

            z-index: 50;

            transition:
                opacity 0.5s ease;
        }


        .loading-overlay.hidden {
            opacity: 0;

            pointer-events: none;
        }


        /* =========================================================
           LOADING SPINNER
           ========================================================= */

        .loading-spinner {
            width: 44px;
            height: 44px;

            border: 3px solid #2d2d30;

            border-top-color: #ececf1;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        .loading-text {
            color: #6e6e72;

            font-size: 14px;
        }


        /* =========================================================
           SPINNER ANIMATION
           ========================================================= */

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================================================
           HIDE SCROLLBARS
           ========================================================= */

        ::-webkit-scrollbar {
            display: none;
        }

    </style>
</head>


<body>


    <!-- =========================================================
         PARENT BACKGROUND
         ========================================================= -->

    <div class="page-background"></div>


    <!-- =========================================================
         TASKADE AGENT
         ========================================================= -->

    <div
        class="agent-container"
        id="agentContainer"
    >

        <!-- =====================================================
             LOADING OVERLAY
             ===================================================== -->

        <div
            class="loading-overlay"
            id="loadingOverlay"
        >

            <div class="loading-spinner"></div>

            <div class="loading-text">
                Loading DeepRWA...
            </div>

        </div>


        <!-- =====================================================
             TASKADE IFRAME
             ===================================================== -->

        <iframe
            id="agentFrame"
            src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431"
            allow="clipboard-read; clipboard-write">
        </iframe>

    </div>


    <!-- =========================================================
         OUTER THEME MASKS

         These cover ONLY the area surrounding the central
         Taskade panel.

         They DO NOT cover the central panel.

         Therefore the following remain visible:

         ✓ av.png
         ✓ DeepRWA header
         ✓ Header divider
         ✓ DeepRWA logo
         ✓ DeepRWA title
         ✓ Welcome message
         ✓ Suggestion buttons
         ✓ Message input
         ✓ "DeepRWA can make a mistake."
         ========================================================= -->

    <div class="outer-top"></div>

    <div class="outer-left"></div>

    <div class="outer-right"></div>


    <!-- =========================================================
         BOTTOM THEME
         ========================================================= -->

    <div class="footer-cover"></div>


    <!-- =========================================================
         FOOTER CLICK BLOCKER
         ========================================================= -->

    <div class="footer-blocker"></div>


    <script>

        /* =========================================================
           TASKADE URL
           ========================================================= */

        const AGENT_URL =
            "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";


        /* =========================================================
           LOADING HANDLER
           ========================================================= */

        function handleLoading() {

            const overlay =
                document.getElementById("loadingOverlay");

            const iframe =
                document.getElementById("agentFrame");


            /* Show loading screen */

            overlay.classList.remove("hidden");


            /* Hide after iframe loads */

            iframe.addEventListener(
                "load",
                function () {

                    setTimeout(
                        function () {

                            overlay.classList.add("hidden");

                        },
                        500
                    );

                },
                {
                    once: true
                }
            );


            /*
             * Safety timeout.
             */

            setTimeout(
                function () {

                    overlay.classList.add("hidden");

                },
                3000
            );
        }


        /* =========================================================
           INITIALIZATION
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                handleLoading();

            }
        );

    </script>

</body>
</html>
