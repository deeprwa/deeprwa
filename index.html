<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRWA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f7f7f8;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #f7f7f8;
            border-right: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            padding: 16px;
            flex-shrink: 0;
            height: 100vh;
            overflow-y: auto;
        }
        
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 16px;
        }
        
        .sidebar-logo img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        
        .sidebar-logo span {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
        }
        
        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #e5e5e5;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 12px;
        }
        
        .new-chat-btn:hover {
            background: #d1d1d1;
        }
        
        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .chat-item {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #1a1a1a;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            margin-bottom: 2px;
        }
        
        .chat-item:hover {
            background: #e5e5e5;
        }
        
        .chat-item.active {
            background: #e5e5e5;
            font-weight: 500;
        }
        
        .chat-item .time {
            font-size: 11px;
            color: #999;
            margin-left: auto;
            white-space: nowrap;
        }
        
        .chat-item .delete-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .chat-item:hover .delete-btn {
            opacity: 1;
        }
        
        .chat-item .delete-btn:hover {
            color: #e74c3c;
        }
        
        .sidebar-footer {
            padding-top: 12px;
            border-top: 1px solid #e5e5e5;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
        
        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
        }
        
        .main-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            border-bottom: 1px solid #e5e5e5;
            flex-shrink: 0;
            background: white;
        }
        
        .main-header img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        
        .main-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
        }
        
        .main-header p {
            font-size: 14px;
            color: #666;
            margin-left: auto;
        }
        
        .agent-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        .agent-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .sidebar {
                width: 220px;
                padding: 12px;
            }
            .main-header {
                padding: 12px 16px;
            }
            .main-header h1 {
                font-size: 16px;
            }
        }
        
        @media (max-width: 500px) {
            .sidebar {
                display: none;
            }
            .mobile-toggle {
                display: flex !important;
            }
        }
        
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #1a1a1a;
            padding: 4px 8px;
            align-items: center;
            justify-content: center;
        }
        
        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        
        .mobile-overlay.active {
            display: block;
        }
        
        .mobile-sidebar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            background: #f7f7f8;
            z-index: 1000;
            padding: 16px;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        
        .mobile-sidebar.active {
            transform: translateX(0);
            display: block;
        }
        
        .mobile-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .mobile-sidebar-header .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="closeMobileSidebar()"></div>
    
    <!-- Mobile Sidebar -->
    <div class="mobile-sidebar" id="mobileSidebar">
        <div class="mobile-sidebar-header">
            <div class="sidebar-logo" style="border:none;margin:0;padding:0;">
                <img src="av.png" alt="DeepRWA">
                <span>DeepRWA</span>
            </div>
            <button class="close-btn" onclick="closeMobileSidebar()">✕</button>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
        <div class="chat-list" id="mobileChatList"></div>
        <div class="sidebar-footer">🇷🇼 DeepRWA</div>
    </div>
    
    <!-- Desktop Sidebar -->
    <div class="sidebar" id="desktopSidebar">
        <div class="sidebar-logo">
            <img src="av.png" alt="DeepRWA">
            <span>DeepRWA</span>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
        <div class="chat-list" id="chatList"></div>
        <div class="sidebar-footer">🇷🇼 DeepRWA · Your AI Assistant for Rwanda</div>
    </div>
    
    <!-- Main Chat Area -->
    <div class="main-chat">
        <div class="main-header">
            <button class="mobile-toggle" onclick="openMobileSidebar()">☰</button>
            <img src="av.png" alt="DeepRWA">
            <h1>DeepRWA</h1>
            <p>Your AI assistant for Rwanda</p>
        </div>
        <div class="agent-container">
            <iframe id="agentFrame" src="YOUR_TASKADE_LINK_HERE" allow="clipboard-read; clipboard-write"></iframe>
        </div>
    </div>

    <script>
        // ============ CONFIGURATION ============
        // Replace with your actual Taskade public link
        const TASKADE_LINK = "YOUR_TASKADE_LINK_HERE";
        
        // ============ CHAT MANAGEMENT ============
        let chats = JSON.parse(localStorage.getItem('deeprwa_chats')) || {};
        let currentChatId = localStorage.getItem('deeprwa_current_chat') || null;
        
        function saveChats() {
            localStorage.setItem('deeprwa_chats', JSON.stringify(chats));
        }
        
        function createNewChat() {
            const id = 'chat_' + Date.now();
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            chats[id] = {
                id: id,
                name: 'New Chat',
                created: now.toISOString(),
                time: timeStr
            };
            currentChatId = id;
            localStorage.setItem('deeprwa_current_chat', id);
            saveChats();
            renderChatList();
            updateAgent();
            closeMobileSidebar();
        }
        
        function deleteChat(id) {
            if (confirm('Delete this chat?')) {
                delete chats[id];
                const keys = Object.keys(chats);
                if (keys.length > 0) {
                    currentChatId = keys[0];
                } else {
                    createNewChat();
                }
                localStorage.setItem('deeprwa_current_chat', currentChatId);
                saveChats();
                renderChatList();
                updateAgent();
            }
        }
        
        function switchChat(id) {
            currentChatId = id;
            localStorage.setItem('deeprwa_current_chat', id);
            renderChatList();
            updateAgent();
            closeMobileSidebar();
        }
        
        function renderChatList() {
            const list = document.getElementById('chatList');
            const mobileList = document.getElementById('mobileChatList');
            const keys = Object.keys(chats);
            
            let html = '';
            if (keys.length === 0) {
                html = '<div style="color:#999;padding:12px;text-align:center;font-size:13px;">No chats yet</div>';
            } else {
                for (const key of keys) {
                    const chat = chats[key];
                    const isActive = key === currentChatId;
                    html += `
                        <div class="chat-item ${isActive ? 'active' : ''}" onclick="switchChat('${key}')">
                            💬 ${chat.name}
                            <span class="time">${chat.time || '--:--'}</span>
                            <button class="delete-btn" onclick="event.stopPropagation();deleteChat('${key}')">✕</button>
                        </div>
                    `;
                }
            }
            
            list.innerHTML = html;
            mobileList.innerHTML = html;
        }
        
        function updateAgent() {
            const frame = document.getElementById('agentFrame');
            // Add a timestamp to force reload
            frame.src = TASKADE_LINK + '?t=' + Date.now();
        }
        
        function openMobileSidebar() {
            document.getElementById('mobileSidebar').classList.add('active');
            document.getElementById('mobileOverlay').classList.add('active');
        }
        
        function closeMobileSidebar() {
            document.getElementById('mobileSidebar').classList.remove('active');
            document.getElementById('mobileOverlay').classList.remove('active');
        }
        
        // ============ INITIALIZE ============
        if (!currentChatId || !chats[currentChatId]) {
            const keys = Object.keys(chats);
            if (keys.length > 0) {
                currentChatId = keys[0];
            } else {
                createNewChat();
            }
            localStorage.setItem('deeprwa_current_chat', currentChatId);
        }
        
        renderChatList();
    </script>
</body>
</html>
