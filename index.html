<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRWA</title>
    <link rel="icon" href="av.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #343541;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: #ececf1;
        }

        .agent-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #343541;
            position: relative;
        }

        .agent-container iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #343541;
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #343541;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 16px;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #2d2d30;
            border-top-color: #ececf1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #6e6e72;
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="agent-container" id="agentContainer">
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading DeepRWA...</div>
        </div>

        <!-- Taskade Agent -->
        <iframe id="agentFrame" src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431" allow="clipboard-read; clipboard-write"></iframe>
    </div>

    <script>
        // ===== HIDE "POWERED BY TASKADE" =====
        function hidePoweredBy() {
            const iframe = document.getElementById('agentFrame');
            if (!iframe) return;

            try {
                // Try to access the iframe content
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (!doc) return;

                // Find all elements and hide those containing "Powered by Taskade"
                const observer = new MutationObserver(() => {
                    try {
                        const elements = doc.body.querySelectorAll('*');
                        for (const el of elements) {
                            if (el.textContent && el.textContent.includes('Powered by Taskade')) {
                                el.style.display = 'none';
                                if (el.parentElement) {
                                    el.parentElement.style.display = 'none';
                                }
                            }
                        }
                    } catch (e) {}
                });

                observer.observe(doc.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });

                // Also check immediately
                setTimeout(() => {
                    const elements = doc.body.querySelectorAll('*');
                    for (const el of elements) {
                        if (el.textContent && el.textContent.includes('Powered by Taskade')) {
                            el.style.display = 'none';
                            if (el.parentElement) {
                                el.parentElement.style.display = 'none';
                            }
                        }
                    }
                }, 1000);

            } catch (e) {
                // Cross-origin restriction: we can't access the iframe content
                // This is normal and expected
            }
        }

        // ===== LOADING OVERLAY =====
        function handleLoading() {
            const overlay = document.getElementById('loadingOverlay');
            const iframe = document.getElementById('agentFrame');

            // Show overlay while loading
            overlay.classList.remove('hidden');

            // Hide overlay when iframe loads
            iframe.addEventListener('load', function() {
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    // Try to hide "Powered by Taskade" after load
                    hidePoweredBy();
                }, 500);
            });

            // Fallback: hide after 3 seconds even if iframe doesn't load
            setTimeout(() => {
                overlay.classList.add('hidden');
                hidePoweredBy();
            }, 3000);
        }

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', function() {
            // Show loading overlay
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');

            // Start loading handler
            handleLoading();

            // Try to hide "Powered by Taskade" periodically
            setInterval(hidePoweredBy, 5000);
        });

        // Also try on window load
        window.addEventListener('load', function() {
            setTimeout(hidePoweredBy, 1000);
        });
    </script>
</body>
</html>
