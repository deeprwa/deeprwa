<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRWA</title>
    <link rel="icon" href="av.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #343541;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: #ececf1;
        }

        .agent-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #343541;
            position: relative;
        }

        .agent-container iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #343541;
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #343541;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 16px;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #2d2d30;
            border-top-color: #ececf1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #6e6e72;
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 1. ROUNDED BORDER ON INPUT FIELD ===== */
        .input-border-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            width: calc(100% - 40px);
            max-width: 768px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid #5a5a5e;
            background: transparent;
            pointer-events: none;
            transition: border-color 0.3s ease;
        }

        /* When focused, change border color */
        .input-border-overlay.active {
            border-color: #1E88E5;
        }

        /* ===== 2. COVER "POWERED BY TASKADE" ===== */
        .powered-cover {
            position: absolute;
            bottom: 8px;
            right: 16px;
            z-index: 15;
            background: #343541;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #8e8e93;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            pointer-events: none;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .input-border-overlay {
                width: calc(100% - 24px);
                bottom: 12px;
                height: 42px;
            }
            .powered-cover {
                font-size: 10px;
                bottom: 4px;
                right: 10px;
                padding: 2px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="agent-container" id="agentContainer">
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading DeepRWA...</div>
        </div>

        <!-- Input Border Overlay -->
        <div class="input-border-overlay" id="inputBorder"></div>

        <!-- Cover "Powered by Taskade" -->
        <div class="powered-cover" id="poweredCover">DeepRWA can make a mistake.</div>

        <!-- Taskade Agent -->
        <iframe id="agentFrame" src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431" allow="clipboard-read; clipboard-write"></iframe>
    </div>

    <script>
        const AGENT_URL = "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";

        // ===== LOADING OVERLAY =====
        function handleLoading() {
            const overlay = document.getElementById('loadingOverlay');
            const iframe = document.getElementById('agentFrame');

            overlay.classList.remove('hidden');

            iframe.addEventListener('load', function() {
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 500);
            });

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 3000);
        }

        // ===== INPUT BORDER FOCUS =====
        function setupInputFocus() {
            const border = document.getElementById('inputBorder');
            const iframe = document.getElementById('agentFrame');

            // Try to detect focus inside iframe
            try {
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (doc) {
                    const inputs = doc.querySelectorAll('input[type="text"], textarea');
                    for (const inp of inputs) {
                        inp.addEventListener('focus', function() {
                            border.classList.add('active');
                        });
                        inp.addEventListener('blur', function() {
                            border.classList.remove('active');
                        });
                        break;
                    }
                }
            } catch (e) {
                // Cross-origin - fallback to click detection
                document.addEventListener('click', function(e) {
                    const rect = border.getBoundingClientRect();
                    if (e.clientY > window.innerHeight - 100) {
                        border.classList.add('active');
                        setTimeout(() => border.classList.remove('active'), 2000);
                    }
                });
            }
        }

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            handleLoading();
            setupInputFocus();
        });

        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 1000);
        });
    </script>
</body>
</html>
