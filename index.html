<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepRWA</title>
    <link rel="icon" href="av.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #343541;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: #ececf1;
        }

        .agent-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #343541;
            position: relative;
        }

        .agent-container iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #343541;
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #343541;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 16px;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #2d2d30;
            border-top-color: #ececf1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #6e6e72;
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COVER "POWERED BY TASKADE" ===== */
        .footer-cover {
            position: absolute;
            bottom: 8px;
            right: 20px;
            z-index: 10;
            background: #343541;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #8e8e93;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            pointer-events: none;
        }

        /* ===== INPUT FIELD BORDER OVERLAY ===== */
        /* This creates a visible border around Taskade's input area */
        .input-border-overlay {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            width: calc(100% - 40px);
            max-width: 768px;
            height: 48px;
            border-radius: 12px;
            border: 2px solid #5a5a5e;
            background: transparent;
            pointer-events: none;
            transition: border-color 0.3s ease;
        }

        /* Make it glow when user types (we can't detect typing, so we use a subtle animation) */
        .input-border-overlay.active {
            border-color: #1E88E5;
        }

        /* Add a subtle glow effect */
        .input-border-overlay::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: 12px;
            pointer-events: none;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .input-border-overlay {
                width: calc(100% - 24px);
                bottom: 8px;
                height: 42px;
            }
            .footer-cover {
                font-size: 10px;
                bottom: 6px;
                right: 10px;
                padding: 2px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="agent-container" id="agentContainer">
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading DeepRWA...</div>
        </div>

        <!-- Footer Cover: "Powered by Taskade" replaced -->
        <div class="footer-cover" id="footerCover">DeepRWA can make a mistake.</div>

        <!-- Input Border Overlay - just visual border around Taskade's input -->
        <div class="input-border-overlay" id="inputBorder"></div>

        <!-- Taskade Agent -->
        <iframe id="agentFrame" src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431" allow="clipboard-read; clipboard-write"></iframe>
    </div>

    <script>
        const AGENT_URL = "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";

        // ===== LOADING OVERLAY =====
        function handleLoading() {
            const overlay = document.getElementById('loadingOverlay');
            const iframe = document.getElementById('agentFrame');

            overlay.classList.remove('hidden');

            iframe.addEventListener('load', function() {
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 500);
            });

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 3000);
        }

        // ===== INPUT BORDER INTERACTION =====
        function setupInputBorder() {
            const border = document.getElementById('inputBorder');
            const iframe = document.getElementById('agentFrame');

            // When user clicks anywhere on the page, focus the input inside iframe
            document.addEventListener('click', function(e) {
                // Check if click is near the bottom of the page (where input is)
                const rect = border.getBoundingClientRect();
                const clickY = e.clientY;
                const clickX = e.clientX;

                if (clickY > window.innerHeight - 100) {
                    // Try to focus the input inside iframe
                    try {
                        const doc = iframe.contentDocument || iframe.contentWindow?.document;
                        if (doc) {
                            const inputs = doc.querySelectorAll('input[type="text"], textarea');
                            for (const inp of inputs) {
                                if (inp.placeholder && inp.placeholder.toLowerCase().includes('ask')) {
                                    inp.focus();
                                    break;
                                }
                            }
                        }
                    } catch (e) {}
                }
            });

            // Try to detect focus on iframe input
            try {
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (doc) {
                    const inputs = doc.querySelectorAll('input[type="text"], textarea');
                    for (const inp of inputs) {
                        if (inp.placeholder && inp.placeholder.toLowerCase().includes('ask')) {
                            inp.addEventListener('focus', function() {
                                border.style.borderColor = '#1E88E5';
                            });
                            inp.addEventListener('blur', function() {
                                border.style.borderColor = '#5a5a5e';
                            });
                            break;
                        }
                    }
                }
            } catch (e) {
                // Cross-origin restriction
            }
        }

        // ===== HIDE "POWERED BY TASKADE" =====
        function hidePoweredBy() {
            const iframe = document.getElementById('agentFrame');
            if (!iframe) return;

            try {
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (!doc) return;

                const observer = new MutationObserver(() => {
                    try {
                        const elements = doc.body.querySelectorAll('*');
                        for (const el of elements) {
                            if (el.textContent && el.textContent.includes('Powered by Taskade')) {
                                el.style.display = 'none';
                                if (el.parentElement) {
                                    el.parentElement.style.display = 'none';
                                }
                            }
                        }
                    } catch (e) {}
                });

                observer.observe(doc.body, {
                    childList: true,
                    subtree: true,
                    characterData: true
                });

                setTimeout(() => {
                    const elements = doc.body.querySelectorAll('*');
                    for (const el of elements) {
                        if (el.textContent && el.textContent.includes('Powered by Taskade')) {
                            el.style.display = 'none';
                            if (el.parentElement) {
                                el.parentElement.style.display = 'none';
                            }
                        }
                    }
                }, 1000);

            } catch (e) {
                // Cross-origin restriction
            }
        }

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loadingOverlay').classList.remove('hidden');

            handleLoading();
            setupInputBorder();

            setInterval(hidePoweredBy, 5000);
        });

        window.addEventListener('load', function() {
            setTimeout(hidePoweredBy, 1000);
        });
    </script>
</body>
</html>
