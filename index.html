<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>DeepRWA</title>

    <link rel="icon" href="av.png" type="image/png">

    <style>

        /* =========================================================
           GLOBAL RESET
           ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================================
           THEME
           ========================================================= */

        :root {

            /*
             * Outer background visible around the Taskade panel.
             */
            --outer-theme: #1e1e1f;

            /*
             * Desktop Taskade panel width.
             */
            --desktop-chat-width: 672px;

            /*
             * Distance from top of browser viewport to
             * Taskade panel.
             */
            --desktop-chat-top: 40px;

            /*
             * Distance from bottom of viewport to the bottom
             * of the Taskade panel.
             *
             * This is also the area used to conceal the
             * Taskade branding.
             */
            --desktop-footer-height: 72px;

            /*
             * Tablet footer area.
             */
            --tablet-footer-height: 60px;

            /*
             * Mobile footer area.
             *
             * This is deliberately large enough to conceal
             * "Powered by Taskade", while the disclaimer above
             * it remains visible.
             */
            --mobile-footer-height: 72px;
        }


        /* =========================================================
           HTML / BODY
           ========================================================= */

        html {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme);

            overflow: hidden;
        }


        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            position: relative;

            overflow: hidden;

            background: var(--outer-theme) !important;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #ececf1;
        }


        /* =========================================================
           FULL PAGE BACKGROUND
           ========================================================= */

        .page-background {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: var(--outer-theme);

            z-index: 0;

            pointer-events: none;
        }


        /* =========================================================
           TASKADE CONTAINER
           ========================================================= */

        .agent-container {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: var(--outer-theme) !important;

            border: 0;
            outline: 0;

            z-index: 1;

            overflow: hidden;
        }


        /* =========================================================
           TASKADE IFRAME
           ========================================================= */

        .agent-container iframe {
            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;
            outline: 0;

            background: transparent !important;

            z-index: 1;
        }


        /* =========================================================
           DESKTOP OUTER THEME — TOP
           ========================================================= */

        .outer-top {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: var(--desktop-chat-top);

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER THEME — LEFT
           ========================================================= */

        .outer-left {
            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--desktop-footer-height);

            left: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           DESKTOP OUTER THEME — RIGHT
           ========================================================= */

        .outer-right {
            position: fixed;

            top: var(--desktop-chat-top);

            bottom: var(--desktop-footer-height);

            right: 0;

            width:
                max(
                    0px,
                    calc(
                        (100vw - var(--desktop-chat-width)) / 2
                    )
                );

            background: var(--outer-theme);

            z-index: 10;

            pointer-events: none;
        }


        /* =========================================================
           FOOTER VISUAL COVER

           IMPORTANT:
           This is ONLY a visual layer.

           pointer-events:none means:
           - clicks pass through
           - mouse events pass through
           - touch events pass through
           - keyboard interaction remains possible
           - Taskade input remains usable

           There is intentionally NO footer blocker.
           ========================================================= */

        .footer-cover {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: var(--desktop-footer-height);

            background: var(--outer-theme) !important;

            z-index: 20;

            /*
             * CRITICAL:
             *
             * Never change this to "auto".
             *
             * The overlay must NOT intercept clicks or touches.
             */
            pointer-events: none;

            user-select: none;

            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;

            border: 0;
            outline: 0;

            box-shadow: none;

            cursor: default;
        }


        /* =========================================================
           LOADING OVERLAY
           ========================================================= */

        .loading-overlay {
            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 16px;

            background: var(--outer-theme) !important;

            z-index: 50;

            opacity: 1;

            transition:
                opacity 0.5s ease;
        }


        .loading-overlay.hidden {
            opacity: 0;

            pointer-events: none;
        }


        /* =========================================================
           LOADING SPINNER
           ========================================================= */

        .loading-spinner {
            width: 44px;
            height: 44px;

            border: 3px solid #2d2d30;

            border-top-color: #ececf1;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        .loading-text {
            color: #6e6e72;

            font-size: 14px;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (min-width: 769px) and (max-width: 1100px) {

            :root {

                --desktop-chat-top: 32px;

                --desktop-footer-height: 60px;

                --desktop-chat-width:
                    min(
                        672px,
                        calc(100vw - 32px)
                    );
            }


            .outer-left,
            .outer-right {
                bottom: var(--desktop-footer-height);
            }


            .footer-cover {
                height: var(--tablet-footer-height);
            }

        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 768px) {

            html,
            body {
                width: 100%;
                height: 100%;

                overflow: hidden;

                background: var(--outer-theme) !important;
            }


            /*
             * No fixed desktop geometry on phones.
             *
             * Taskade controls its own responsive panel width.
             */
            .outer-top,
            .outer-left,
            .outer-right {
                display: none;
            }


            /*
             * IMPORTANT:
             *
             * We DO NOT disable .footer-cover here.
             *
             * The cover is required to conceal the
             * "Powered by Taskade" branding.
             *
             * Because pointer-events is NONE, it does not
             * prevent interaction with Taskade.
             */
            .footer-cover {
                display: block;

                height:
                    calc(
                        var(--mobile-footer-height)
                        + env(safe-area-inset-bottom)
                    );

                bottom: 0;

                background: var(--outer-theme) !important;

                pointer-events: none;

                z-index: 20;
            }


            /*
             * Full mobile Taskade experience.
             */
            .agent-container {
                position: fixed;

                top: 0;
                left: 0;
                right: 0;
                bottom: 0;

                width: 100%;
                height: 100%;

                overflow: hidden;

                background: var(--outer-theme) !important;
            }


            /*
             * Responsive iframe.
             */
            .agent-container iframe {
                position: absolute;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                border: 0;

                background: transparent !important;
            }

        }


        /* =========================================================
           SMALL PHONES
           ========================================================= */

        @media (max-width: 480px) {

            .outer-top,
            .outer-left,
            .outer-right {
                display: none;
            }


            .footer-cover {
                display: block;

                /*
                 * Slightly more conservative cover on very
                 * narrow screens.
                 */
                height:
                    calc(
                        72px
                        + env(safe-area-inset-bottom)
                    );

                pointer-events: none;
            }


            .agent-container {
                width: 100%;
                height: 100%;
            }


            .agent-container iframe {
                width: 100%;
                height: 100%;
            }

        }


        /* =========================================================
           LANDSCAPE PHONES
           ========================================================= */

        @media (max-width: 900px) and (orientation: landscape) {

            /*
             * Do not use desktop side masks in landscape.
             */
            .outer-top,
            .outer-left,
            .outer-right {
                display: none;
            }


            /*
             * Keep branding cover active.
             */
            .footer-cover {
                display: block;

                height:
                    calc(
                        58px
                        + env(safe-area-inset-bottom)
                    );

                pointer-events: none;
            }


            .agent-container,
            .agent-container iframe {
                width: 100%;
                height: 100%;
            }

        }


        /* =========================================================
           TOUCH DEVICES
           ========================================================= */

        @media (hover: none) and (pointer: coarse) {

            /*
             * Keep the visual cover.
             *
             * DO NOT add a click blocker.
             */
            .footer-cover {
                display: block;

                pointer-events: none;
            }

        }


        /* =========================================================
           VERY TALL MOBILE SCREENS
           ========================================================= */

        @media (max-width: 768px) and (min-height: 800px) {

            .footer-cover {
                height:
                    calc(
                        72px
                        + env(safe-area-inset-bottom)
                    );
            }

        }


        /* =========================================================
           HIDE SCROLLBAR
           ========================================================= */

        ::-webkit-scrollbar {
            display: none;
        }

    </style>
</head>


<body>


    <!-- =========================================================
         FULL PAGE BACKGROUND
         ========================================================= -->

    <div class="page-background"></div>


    <!-- =========================================================
         TASKADE AGENT
         ========================================================= -->

    <div
        class="agent-container"
        id="agentContainer"
    >

        <!-- =====================================================
             LOADING OVERLAY
             ===================================================== -->

        <div
            class="loading-overlay"
            id="loadingOverlay"
        >

            <div class="loading-spinner"></div>

            <div class="loading-text">
                Loading DeepRWA...
            </div>

        </div>


        <!-- =====================================================
             TASKADE IFRAME
             ===================================================== -->

        <iframe
            id="agentFrame"
            src="https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431"
            allow="clipboard-read; clipboard-write"
            title="DeepRWA AI Assistant">
        </iframe>

    </div>


    <!-- =========================================================
         DESKTOP OUTER THEME
         ========================================================= -->

    <div
        class="outer-top"
        aria-hidden="true">
    </div>


    <div
        class="outer-left"
        aria-hidden="true">
    </div>


    <div
        class="outer-right"
        aria-hidden="true">
    </div>


    <!-- =========================================================
         BOTTOM VISUAL COVER
         
         IMPORTANT:
         There is NO footer-blocker.

         This element is intentionally pointer-events:none.
         ========================================================= -->

    <div
        class="footer-cover"
        aria-hidden="true">
    </div>


    <script>

        /* =========================================================
           TASKADE URL
           ========================================================= */

        const AGENT_URL =
            "https://www.taskade.com/a/deep-rwa-01M177XSSH1HNA6FKZM6EBQ431";


        /* =========================================================
           LOADING HANDLER
           ========================================================= */

        function handleLoading() {

            const overlay =
                document.getElementById("loadingOverlay");

            const iframe =
                document.getElementById("agentFrame");


            if (!overlay || !iframe) {
                return;
            }


            /*
             * Show loading screen initially.
             */

            overlay.classList.remove("hidden");


            /*
             * Hide it once Taskade has loaded.
             */

            iframe.addEventListener(
                "load",
                function () {

                    setTimeout(
                        function () {

                            overlay.classList.add("hidden");

                        },
                        500
                    );

                },
                {
                    once: true
                }
            );


            /*
             * Safety fallback.
             */

            setTimeout(
                function () {

                    overlay.classList.add("hidden");

                },
                3500
            );
        }


        /* =========================================================
           INITIALIZE
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                handleLoading();

            }
        );

    </script>

</body>
</html>
